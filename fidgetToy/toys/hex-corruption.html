<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hex Corruption | Fidget Toy Garden</title>
  <meta name="description" content="An interactive retro memory grid glitch toy. Shear, melt, vortex, infect, and shatter data with satisfying sound design and multiple neon styles." />
  
  <style>
    :root {
      --font-mono: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --bg-color: #030407;
      --text-base: #1a351a;
      --text-accent: #39ff14;
      --panel-bg: rgba(10, 15, 12, 0.82);
      --panel-border: rgba(57, 255, 20, 0.18);
      --ui-text: rgba(255, 255, 255, 0.55);
      --ui-text-hover: rgba(255, 255, 255, 1);
      --glow-shadow: 0 0 12px rgba(57, 255, 20, 0.35);
      --selection-color: rgba(57, 255, 20, 0.2);
    }

    .theme-cyber-green {
      --bg-color: #030407;
      --text-base: #132413;
      --text-accent: #39ff14;
      --panel-bg: rgba(6, 12, 8, 0.85);
      --panel-border: rgba(57, 255, 20, 0.2);
      --glow-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }

    .theme-neon-decay {
      --bg-color: #08030d;
      --text-base: #351445;
      --text-accent: #ff007f;
      --panel-bg: rgba(15, 6, 22, 0.85);
      --panel-border: rgba(255, 0, 127, 0.2);
      --glow-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .theme-solar-amber {
      --bg-color: #0a0500;
      --text-base: #402000;
      --text-accent: #ff9100;
      --panel-bg: rgba(20, 10, 0, 0.85);
      --panel-border: rgba(255, 145, 0, 0.2);
      --glow-shadow: 0 0 15px rgba(255, 145, 0, 0.4);
    }

    .theme-supernova {
      --bg-color: #020215;
      --text-base: #1a1a52;
      --text-accent: #00d2ff;
      --panel-bg: rgba(4, 4, 25, 0.85);
      --panel-border: rgba(0, 210, 255, 0.2);
      --glow-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }

    .theme-paper-glitch {
      --bg-color: #f5efff;
      --text-base: #d2c5e5;
      --text-accent: #6f2dbd;
      --panel-bg: rgba(240, 232, 250, 0.88);
      --panel-border: rgba(111, 45, 189, 0.22);
      --glow-shadow: 0 0 8px rgba(111, 45, 189, 0.15);
      --ui-text: rgba(28, 24, 40, 0.65);
      --ui-text-hover: rgba(28, 24, 40, 1);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      transition: background-color 0.4s ease;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Floating Navigation Controls */
    .toy-nav {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: none;
    }

    .back-link,
    .reboot-btn,
    .settings-toggle,
    .sound-toggle {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-accent);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      text-decoration: none;
      pointer-events: auto;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .sound-toggle {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 1.05rem;
    }

    .back-link:hover,
    .reboot-btn:hover,
    .settings-toggle:hover, .settings-toggle.active,
    .sound-toggle:hover, .sound-toggle.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text-accent);
      box-shadow: var(--glow-shadow);
      color: #fff;
    }

    /* Glassmorphic settings panel */
    .settings-panel {

      top: 75px;
      left: 20px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);

      color: var(--text-accent);

      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), var(--glow-shadow);
      font-family: var(--font-mono);
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .settings-panel.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .panel-header h2 {
      font-size: 1.05rem;
      margin: 0;
      letter-spacing: 0.1em;
      font-weight: bold;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--ui-text);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }

    .close-btn:hover {
      color: var(--ui-text-hover);
    }

    .panel-section {
      margin-bottom: 18px;
    }

    .panel-section h3 {
      font-size: 0.78rem;
      margin: 0 0 10px 0;
      color: var(--ui-text);
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .mode-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mode-card {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(0, 0, 0, 0.2);
    }

    .mode-card input {
      display: none;
    }

    .mode-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-size: 0.7rem;
      color: var(--ui-text);
      background: rgba(0, 0, 0, 0.4);
    }

    .mode-info {
      display: flex;
      flex-direction: column;
    }

    .mode-title {
      font-size: 0.82rem;
      font-weight: bold;
      color: var(--text-accent);
      letter-spacing: 0.05em;
    }

    .mode-desc {
      font-size: 0.68rem;
      color: var(--ui-text);
    }

    .mode-card:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--text-accent);
    }

    .mode-card.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--text-accent);
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.08);
    }

    .mode-card.active .mode-key {
      border-color: var(--text-accent);
      color: var(--text-accent);
      background: rgba(57, 255, 20, 0.1);
    }

    .cyber-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-accent);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 8px 10px;
      cursor: pointer;
      outline: none;

    .cyber-select:hover,

    }

    .slider-control {

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      margin-bottom: 5px;
      color: var(--ui-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;

    .slider-val {
      color: var(--text-accent);
    }

    .slider-control input[type="range"] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;

    .slider-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--text-accent);
      transition: transform 0.1s ease;
    }

    .slider-control input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* Bottom Info Status Bar */
    .toy-status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--ui-text);
      font-size: 0.8rem;
      font-family: var(--font-mono);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 6px 16px;
      border-radius: 20px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toy-status:hover {
      border-color: var(--text-accent);
      color: var(--ui-text-hover);
      box-shadow: var(--glow-shadow);
    }

    /* CRT screen overlay simulation */
    .crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.7);
    }

    /* Fullscreen boot loading diagnostics */
    .boot-loader {
      position: fixed;
      inset: 0;
      background: #000;
      color: #39ff14;
      z-index: 1000;
      font-family: var(--font-mono);
      padding: 40px;
      font-size: 0.95rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .boot-loader.active {
      opacity: 1;
      pointer-events: auto;
    }

    .boot-loader.theme-cyber-green { color: #39ff14; background: #010301; }
    .boot-loader.theme-neon-decay { color: #ff007f; background: #030105; }
    .boot-loader.theme-solar-amber { color: #ff9100; background: #040200; }
    .boot-loader.theme-supernova { color: #00d2ff; background: #01010a; }
    .boot-loader.theme-paper-glitch { color: #6f2dbd; background: #f5efff; }

    .boot-content {
      max-width: 800px;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    .boot-cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: currentColor;
      animation: blink 0.8s infinite;
      vertical-align: middle;
      margin-left: 4px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Mobile Responsive Styling */
    @media (max-width: 480px) {
      .settings-panel {
        width: calc(100% - 32px);
        left: 16px;
        right: 16px;
        top: 70px;
        max-height: calc(100vh - 140px);
        overflow-y: auto;
      }
      
      .toy-nav {
        left: 12px;
        right: 12px;
        top: 12px;
        gap: 8px;
        width: calc(100% - 24px);
        justify-content: space-between;
      }
      
      .back-link, .reboot-btn, .settings-toggle, .sound-toggle {
        padding: 5px 10px;
        font-size: 0.75rem;
      }
      
      .toy-status {
        bottom: 12px;
        font-size: 0.72rem;
        padding: 5px 12px;
        width: calc(100% - 24px);
        text-align: center;
        border-radius: 8px;
      }
    }
  </style>
</head>

<body class="toy-page theme-cyber-green">

  <script>
    const canvas = document.getElementById('glitch-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const rebootBtn = document.getElementById('reboot-btn');
    const soundBtn = document.getElementById('sound-toggle');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel = document.getElementById('settings-panel');
    const closeSettings = document.getElementById('close-settings');
    const themeSelect = document.getElementById('theme-select');
    const statusBar = document.getElementById('status-bar');
    const bootLoader = document.getElementById('boot-loader');
    const bootLog = document.getElementById('boot-log');

    // Grid sizing
    let width, height, cols, rows;
    let CELL_SIZE = 22;
    let grid = [];
    let pools = []; // Bottom ooze pools for Melt mode
    const activeParticles = [];
    let frameCount = 0;

    // Fidget options
    let mode = 'shred'; // shred, melt, vortex, infect, shatter
    let activeTheme = 'cyber-green';
    let glitchStrength = 100; // slider range 20 - 200
    let droneVolSliderValue = 30;
    let sfxVolSliderValue = 50;

    const HEX_CHARS = "0123456789ABCDEF";
    const getRandomHex = () => HEX_CHARS[Math.floor(Math.random() * 16)] + HEX_CHARS[Math.floor(Math.random() * 16)];

    // Neon Volatile Custom Theme Configurations
    const THEMES = {
      'cyber-green': {
        bg: '#030407',
        base: '#132413',
        accent: '#39ff14',
        melt: '#22bb22',
        infect: '#ff3333',
        dead: '#050a05',
        glitchColors: ["#ff0055", "#00ffff", "#39ff14", "#ffff00", "#ff00ff"]
      },
      'neon-decay': {
        bg: '#08030d',
        base: '#351445',
        accent: '#ff007f',
        melt: '#00ffff',
        infect: '#ffff00',
        dead: '#0e0414',
        glitchColors: ["#ff007f", "#00ffff", "#ffff00", "#ff00ff", "#ffffff"]
      },
      'solar-amber': {
        bg: '#0a0500',
        base: '#402000',
        accent: '#ff9100',
        melt: '#ffb300',
        infect: '#ff3c00',
        dead: '#140800',
        glitchColors: ["#ff9100", "#ffd166", "#ff5500", "#ffea00", "#ffffff"]
      },
      'supernova': {
        bg: '#020215',
        base: '#1a1a52',
        accent: '#00d2ff',
        melt: '#00ffaa',
        infect: '#7b2cbf',
        dead: '#02020e',
        glitchColors: ["#00d2ff", "#00ffaa", "#7b2cbf", "#ffffff", "#ff00bb"]
      },
      'paper-glitch': {
        bg: '#f5efff',
        base: '#d2c5e5',
        accent: '#6f2dbd',
        melt: '#3f37c9',
        infect: '#f72585',
        dead: '#eae3f2',
        glitchColors: ["#6f2dbd", "#3f37c9", "#4cc9f0", "#f72585", "#1c1828"]
      }
    };

    // Keyboard & Click Cheat Code Trackers (Easter Egg)
    let clickCount = 0;
    let cheatCodeTriggered = false;
    let keyBuffer = '';

    // Pointer Tracking
    let ptr = { x: -1000, y: -1000, px: -1000, py: -1000, active: false };

    // Audio Stack Variables
    let isSoundEnabled = false;
    let audioCtx = null;
    let masterGain = null;
    let droneOsc1 = null;
    let droneOsc2 = null;
    let droneGain = null;
    let droneFilter = null;
    let sfxGain = null;
    let noiseBuffer = null;

    // Initialize Audio stack procedurally
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Master Gain
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);
      
      // FX Gain Bus
      sfxGain = audioCtx.createGain();
      sfxGain.gain.setValueAtTime(sfxVolSliderValue / 100, audioCtx.currentTime);
      sfxGain.connect(masterGain);
      
      // Ambient Drone Bus
      droneGain = audioCtx.createGain();
      droneGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      
      droneFilter = audioCtx.createBiquadFilter();
      droneFilter.type = 'lowpass';
      droneFilter.frequency.setValueAtTime(150, audioCtx.currentTime);
      droneFilter.Q.setValueAtTime(4, audioCtx.currentTime);
      
      // Fat detuned analog-synth-like drone oscillators
      droneOsc1 = audioCtx.createOscillator();
      droneOsc1.type = 'sawtooth';
      droneOsc1.frequency.setValueAtTime(55, audioCtx.currentTime); // A1
      
      droneOsc2 = audioCtx.createOscillator();
      droneOsc2.type = 'triangle';
      droneOsc2.frequency.setValueAtTime(55.4, audioCtx.currentTime); // Detuned chorus
      
      droneOsc1.connect(droneFilter);
      droneOsc2.connect(droneFilter);
      droneFilter.connect(droneGain);
      droneGain.connect(masterGain);
      
      droneOsc1.start();
      droneOsc2.start();
      
      // Compile 2 seconds of noise for procedural glitch static
      const sampleRate = audioCtx.sampleRate;
      noiseBuffer = audioCtx.createBuffer(1, sampleRate * 2, sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseBuffer.length; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      
      // Gently ramp up drone volume initially
      droneGain.gain.setTargetAtTime((droneVolSliderValue / 100) * 0.2, audioCtx.currentTime, 0.5);
    }

    function resumeAudio() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function updateDrone(speed) {
      if (!audioCtx || !isSoundEnabled || !droneFilter) return;
      const now = audioCtx.currentTime;
      // Cursor movements trigger sweeping lowpass filters and swell volume
      const targetFilter = 150 + Math.min(speed * 12 * (glitchStrength / 100), 1200);
      const targetVolume = Math.max(0.02, Math.min(speed * 0.015, 0.35)) * (droneVolSliderValue / 100);
      
      droneFilter.frequency.setTargetAtTime(targetFilter, now, 0.1);
      droneGain.gain.setTargetAtTime(targetVolume, now, 0.15);
      
      // Add subtle speed-based pitch vibrato
      droneOsc1.frequency.setTargetAtTime(55 + speed * 0.08, now, 0.25);
      droneOsc2.frequency.setTargetAtTime(55.4 + speed * 0.1, now, 0.25);
    }

    // Sound FX Stack
    function playGlitchTick(volFactor = 1.0) {
      if (!audioCtx || !isSoundEnabled) return;
      const now = audioCtx.currentTime;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      
      // Short click synthesizer node
      osc.type = Math.random() > 0.4 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(1200 + Math.random() * 3200, now);
      
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2000 + Math.random() * 3000, now);
      filter.Q.setValueAtTime(3, now);
      
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.05 * (sfxVolSliderValue / 100) * volFactor, now + 0.001);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.006 + Math.random() * 0.012);
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(sfxGain);
      
      osc.start(now);
      osc.stop(now + 0.04);
    }

    function playDripSFX() {
      if (!audioCtx || !isSoundEnabled) return;
      const now = audioCtx.currentTime;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1400 + Math.random() * 500, now);
      osc.frequency.exponentialRampToValueAtTime(320 + Math.random() * 200, now + 0.07);
      
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.07 * (sfxVolSliderValue / 100), now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      
      osc.connect(gain);
      gain.connect(sfxGain);
      
      osc.start(now);
      osc.stop(now + 0.09);
    }

    let vortexNoiseNode = null;
    let vortexFilterNode = null;
    let vortexGainNode = null;

    function startVortexSound() {
      if (!audioCtx || !isSoundEnabled || vortexNoiseNode) return;
      const now = audioCtx.currentTime;
      
      vortexNoiseNode = audioCtx.createBufferSource();
      vortexNoiseNode.buffer = noiseBuffer;
      vortexNoiseNode.loop = true;
      
      vortexFilterNode = audioCtx.createBiquadFilter();
      vortexFilterNode.type = 'bandpass';
      vortexFilterNode.frequency.setValueAtTime(160, now);
      vortexFilterNode.Q.setValueAtTime(6, now);
      
      vortexGainNode = audioCtx.createGain();
      vortexGainNode.gain.setValueAtTime(0.001, now);
      vortexGainNode.gain.linearRampToValueAtTime(0.14 * (sfxVolSliderValue / 100), now + 0.25);
      
      vortexNoiseNode.connect(vortexFilterNode);
      vortexFilterNode.connect(vortexGainNode);
      vortexGainNode.connect(sfxGain);
      
      vortexNoiseNode.start(now);
    }

    function updateVortexSound(intensity) {
      if (!audioCtx || !vortexFilterNode || !isSoundEnabled) return;
      const now = audioCtx.currentTime;
      const freq = 120 + Math.min(intensity * 15, 2000);
      vortexFilterNode.frequency.setTargetAtTime(freq, now, 0.08);
      const volume = Math.min(0.01 + intensity * 0.004, 0.22) * (sfxVolSliderValue / 100);
      vortexGainNode.gain.setTargetAtTime(volume, now, 0.12);
    }

    function stopVortexSound() {
      if (!vortexNoiseNode) return;
      const now = audioCtx.currentTime;
      try {
        vortexGainNode.gain.cancelScheduledValues(now);
        vortexGainNode.gain.setValueAtTime(vortexGainNode.gain.value, now);
        vortexGainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        const nodeToStop = vortexNoiseNode;
        setTimeout(() => {
          try { nodeToStop.stop(); } catch(e){}
        }, 150);
      } catch(e){}
      vortexNoiseNode = null;
      vortexFilterNode = null;
      vortexGainNode = null;
    }

    function playShatterChime() {
      if (!audioCtx || !isSoundEnabled) return;
      const now = audioCtx.currentTime;
      const notes = [440, 523.25, 659.25, 783.99, 880]; // Am7 Chime
      const vol = sfxVolSliderValue / 100;
      
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.025);
        
        gain.gain.setValueAtTime(0.001, now + idx * 0.025);
        gain.gain.linearRampToValueAtTime(0.045 * vol, now + idx * 0.025 + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.025 + 0.35);
        
        osc.connect(gain);
        gain.connect(sfxGain);
        
        osc.start(now + idx * 0.025);
        osc.stop(now + idx * 0.025 + 0.4);
      });
    }

    function playRebootSFX() {
      if (!audioCtx || !isSoundEnabled) return;
      const now = audioCtx.currentTime;
      const vol = sfxVolSliderValue / 100;
      
      // Deep bass drop
      const osc1 = audioCtx.createOscillator();
      const filter1 = audioCtx.createBiquadFilter();
      const gain1 = audioCtx.createGain();
      
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(110, now);
      osc1.frequency.exponentialRampToValueAtTime(25, now + 0.45);
      
      filter1.type = 'lowpass';
      filter1.frequency.setValueAtTime(450, now);
      filter1.frequency.exponentialRampToValueAtTime(45, now + 0.45);
      
      gain1.gain.setValueAtTime(0.2 * vol, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      
      osc1.connect(filter1);
      filter1.connect(gain1);
      gain1.connect(sfxGain);
      
      osc1.start(now);
      osc1.stop(now + 0.6);
      
      // Cyber sweep rise
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(300, now + 0.18);
      osc2.frequency.exponentialRampToValueAtTime(1800, now + 0.58);
      
      gain2.gain.setValueAtTime(0.001, now + 0.18);
      gain2.gain.linearRampToValueAtTime(0.08 * vol, now + 0.22);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.58);
      
      osc2.connect(gain2);
      gain2.connect(sfxGain);
      
      osc2.start(now + 0.18);
      osc2.stop(now + 0.65);
    }

    // Grid Construction
    function resizeGrid() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cols = Math.ceil(width / CELL_SIZE);
      rows = Math.ceil(height / CELL_SIZE);
      
      grid = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          grid.push({
            char: getRandomHex(),
            baseChar: '',
            state: 'normal', // normal, glitching, infected, dead
            decayTimer: 0,
            vx: 0, vy: 0,
            x: 0, y: 0,
            tx: 0, ty: 0,
            color: '',
            detached: false
          });
        }
      }
      
      // Cache home locations
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const cell = grid[idx];
          cell.tx = c * CELL_SIZE + CELL_SIZE / 2;
          cell.ty = r * CELL_SIZE + CELL_SIZE / 2;
          cell.x = cell.tx;
          cell.y = cell.ty;
          cell.baseChar = cell.char;
        }
      }
      
      pools = new Array(cols).fill(0);
    }

      resizeGrid();
      activeParticles.length = 0;
    });

    // Cellular Automata Infection
    function infectNeighbors(r, c) {
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      const t = THEMES[activeTheme];
      
      dirs.forEach(([dr, dc]) => {
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          const idx = nr * cols + nc;
          const cell = grid[idx];
          if (cell && cell.state === 'normal' && !cell.detached) {
            cell.state = 'infected';
            cell.decayTimer = 90 + Math.random() * 60;
            cell.color = t.infect;
            cell.char = '█';
          }
        }
      });
    }

    // Helper: convert hex to rgba
    function hexToRgba(hex, alpha) {
      if (hex.startsWith('#')) {

        let b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;

      return hex;

    // Main Draw & Animation Loop
    function animate() {
      const t = THEMES[activeTheme];
      
      // 1. Draw base console grid background
      ctx.fillStyle = t.bg;
      ctx.fillRect(0, 0, width, height);

      // 2. Melt pools calculations
      let drawPools = false;
      for (let c = 0; c < cols; c++) {
        if (pools[c] > 0) {
          drawPools = true;
          pools[c] -= 0.08; // gradual decay
          if (pools[c] < 0) pools[c] = 0;
        }
      }

      if (drawPools) {
        ctx.fillStyle = t.melt;
        ctx.shadowBlur = 10;
        ctx.shadowColor = t.melt;
        for (let c = 0; c < cols; c++) {
          if (pools[c] > 0) {
            ctx.fillRect(c * CELL_SIZE, height - pools[c], CELL_SIZE, pools[c]);
          }
        }
        ctx.shadowBlur = 0;
      }

      // 3. Pointer-induced kinetic friction
      const dx = ptr.x - ptr.px;
      const dy = ptr.y - ptr.py;
      const speed = Math.hypot(dx, dy);

      updateDrone(speed);

      const isLingering = ptr.active && speed < 1.5;
      const isShearing = ptr.active && speed >= 1.5;

      if (ptr.active && ptr.x >= 0 && ptr.y >= 0 && !isBooting) {
        const pCol = Math.floor(ptr.x / CELL_SIZE);
        const pRow = Math.floor(ptr.y / CELL_SIZE);
        
        // Dynamic influence field radius
        const radius = Math.min(Math.max(Math.floor(speed / 4 * (glitchStrength / 100)), 2), 8);

        if (mode === 'vortex') {
          startVortexSound();
          let count = 0;
          activeParticles.forEach(p => { if (p.type === 'vortex') count++; });
          updateVortexSound(count);
        }

        for (let r = -radius; r <= radius; r++) {
          for (let c = -radius; c <= radius; c++) {
            if (r*r + c*c <= radius*radius) {
              const targetCol = pCol + c;
              const targetRow = pRow + r;

              if (targetCol >= 0 && targetCol < cols && targetRow >= 0 && targetRow < rows) {
                const idx = targetRow * cols + targetCol;
                const cell = grid[idx];

                if (cell) {
                  if (mode === 'shred' && isShearing) {
                    cell.state = 'glitching';
                    cell.decayTimer = 20 + Math.random() * 30;
                    cell.vx += dx * 0.42 * (glitchStrength / 100);
                    cell.vy += dy * 0.12 * (glitchStrength / 100);
                    cell.color = t.glitchColors[Math.floor(Math.random() * t.glitchColors.length)];

                    if (Math.random() > 0.86) {
                      playGlitchTick(Math.min(speed / 10, 1));
                    }
                  }
                  else if (mode === 'melt' && !cell.detached && activeParticles.length < 800) {
                    cell.detached = true;
                    cell.state = 'melting';
                    activeParticles.push({
                      x: cell.x,
                      y: cell.y,
                      originCol: targetCol,
                      originRow: targetRow,
                      vx: (Math.random() - 0.5) * 1.5,
                      vy: 1.5 + Math.random() * 3,
                      char: cell.char,
                      color: t.melt,
                      type: 'melt',
                      life: 1.0,
                      trail: []
                    });

                    if (Math.random() > 0.95) {
                      playDripSFX();
                    }
                  }
                  else if (mode === 'vortex' && !cell.detached && activeParticles.length < 800) {
                    cell.detached = true;
                    cell.state = 'glitching';
                    const angle = Math.atan2(cell.y - ptr.y, cell.x - ptr.x);
                    activeParticles.push({
                      x: cell.x,
                      y: cell.y,
                      originCol: targetCol,
                      originRow: targetRow,
                      vx: -Math.sin(angle) * (2.5 + Math.random() * 3),
                      vy: Math.cos(angle) * (2.5 + Math.random() * 3),
                      char: cell.char,
                      color: t.accent,
                      type: 'vortex',
                      angle: angle,
                      dist: Math.hypot(cell.x - ptr.x, cell.y - ptr.y)
                    });
                  }
                  else if (mode === 'infect') {
                    if (cell.state === 'normal') {
                      cell.state = 'infected';
                      cell.decayTimer = 110 + Math.random() * 70;
                      cell.color = t.infect;
                      cell.char = '█';
                      if (Math.random() > 0.92) {
                        playGlitchTick(0.35);
                      }
                    }
                  }
                  else if (mode === 'shatter' && !cell.detached && activeParticles.length < 800) {
                    cell.detached = true;
                    const angle = Math.random() * Math.PI * 2;
                    const force = (3 + Math.random() * 5) * (glitchStrength / 100);
                    activeParticles.push({
                      x: cell.x,
                      y: cell.y,
                      originCol: targetCol,
                      originRow: targetRow,
                      vx: Math.cos(angle) * force + dx * 0.12,
                      vy: Math.sin(angle) * force + dy * 0.12,
                      char: Math.random() > 0.55 ? '1' : '0',
                      color: t.glitchColors[Math.floor(Math.random() * t.glitchColors.length)],
                      type: 'shatter',
                      rotation: Math.random() * Math.PI * 2,
                      rotSpeed: (Math.random() - 0.5) * 0.16,
                      scale: 0.95 + Math.random() * 0.3,
                      life: 1.0
                    });

                    if (Math.random() > 0.93) {
                      playGlitchTick(0.65);
                    }
                  }
                }
              }
            }
          }
        }
      }

      ptr.px = ptr.x;
      ptr.py = ptr.y;

      // 4. Render Grid Sectors (Batch drawing optimizations)
      ctx.font = '13px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const normalCells = [];
      const infectedCells = [];
      const simpleGlitchCells = [];
      const aberrationCells = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const idx = r * cols + c;
          const cell = grid[idx];
          if (!cell || cell.detached) continue;

          if (cell.state === 'normal') {
            if (Math.random() > 0.9995) {
              cell.char = cell.baseChar;
            }
            normalCells.push(cell);
          }
          else if (cell.state === 'infected') {
            if (frameCount % 8 === 0 && Math.random() > 0.94) {
              infectNeighbors(r, c);
            }
            
            cell.decayTimer--;
            
            if (cell.decayTimer < 25) {
              cell.char = '░';
              cell.color = t.dead;
            } else if (cell.decayTimer < 50) {
              cell.char = '▒';
            } else if (cell.decayTimer < 75) {
              cell.char = '▓';
            }

            if (cell.decayTimer <= 0) {
              cell.state = 'dead';
              cell.char = ' ';
            } else {
              infectedCells.push(cell);
            }
          }
          else if (cell.state === 'glitching') {
            cell.x += cell.vx;
            cell.y += cell.vy;
            
            cell.vx += (cell.tx - cell.x) * 0.08;
            cell.vy += (cell.ty - cell.y) * 0.08;
            cell.vx *= 0.82;
            cell.vy *= 0.82;
            
            cell.decayTimer--;
            if (cell.decayTimer <= 0) {
              cell.state = 'normal';
              cell.x = cell.tx;
              cell.y = cell.ty;
              cell.vx = 0;
              cell.vy = 0;
              normalCells.push(cell);
              continue;
            }

            if (Math.random() > 0.84) {
              cell.char = getRandomHex();
            }

            // Only aberration-render if offset displacement is significant
            const offset = Math.abs(cell.x - cell.tx);
            if (offset > 1.5) {
              aberrationCells.push(cell);
            } else {
              simpleGlitchCells.push(cell);
            }
          }
        }
      }

      // Pass 1: Draw Normal Cells (grouped fillStyle)
      ctx.fillStyle = t.base;
      for (let i = 0; i < normalCells.length; i++) {
        const cell = normalCells[i];
        ctx.fillText(cell.char, cell.x, cell.y);
      }

      // Pass 2: Draw Infected Cells
      for (let i = 0; i < infectedCells.length; i++) {
        const cell = infectedCells[i];
        ctx.fillStyle = cell.color;
        ctx.fillText(cell.char, cell.x, cell.y);
      }

      // Pass 3: Draw Simple Glitch Cells (no offset aberration)
      for (let i = 0; i < simpleGlitchCells.length; i++) {
        const cell = simpleGlitchCells[i];
        ctx.fillStyle = cell.color;
        ctx.fillText(cell.char, cell.x, cell.y);
      }

      // Pass 4: Draw Aberration Cells (requires grouped offsets to minimize state updates)
      if (aberrationCells.length > 0) {
        // Cyan offset
        ctx.fillStyle = 'rgba(0, 255, 255, 0.6)';
        for (let i = 0; i < aberrationCells.length; i++) {
          const cell = aberrationCells[i];
          ctx.fillText(cell.char, cell.x - 3, cell.y);
        }

        // Red offset
        ctx.fillStyle = 'rgba(255, 0, 85, 0.6)';
        for (let i = 0; i < aberrationCells.length; i++) {
          const cell = aberrationCells[i];
          ctx.fillText(cell.char, cell.x + 3, cell.y);
        }

        // Accent top pass
        for (let i = 0; i < aberrationCells.length; i++) {
          const cell = aberrationCells[i];
          ctx.fillStyle = cell.color;
          ctx.fillText(cell.char, cell.x, cell.y);
        }
      }

      // 5. Update and render active kinetic particles
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];

        if (p.type === 'melt') {
          p.vy += 0.22;
          p.vx *= 0.98;
          p.x += p.vx;
          p.y += p.vy;

          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 4) p.trail.shift();

          p.trail.forEach((pos, tidx) => {
            const alpha = (tidx / p.trail.length) * 0.3;
            ctx.fillStyle = hexToRgba(p.color, alpha);
            ctx.fillText(p.char, pos.x, pos.y);
          });

          if (p.y >= height) {
            pools[p.originCol] = Math.min(height * 0.12, pools[p.originCol] + 12);
            
            const cellIdx = p.originRow * cols + p.originCol;
            setTimeout(() => {
              if (grid[cellIdx]) {
                grid[cellIdx].detached = false;
                grid[cellIdx].state = 'normal';
              }
            }, 1800 + Math.random() * 1800);

            activeParticles.splice(i, 1);
            continue;
          }

          ctx.fillStyle = p.color;
          ctx.fillText(p.char, p.x, p.y);
        }
        
        else if (p.type === 'vortex') {
          if (ptr.active && mode === 'vortex') {
            const dx = ptr.x - p.x;
            const dy = ptr.y - p.y;
            const dist = Math.hypot(dx, dy) || 1;

            const gravity = 0.5 * (glitchStrength / 100);
            const orbit = 1.7;

            p.vx += (dx / dist) * gravity - (dy / dist) * orbit;
            p.vy += (dy / dist) * gravity + (dx / dist) * orbit;

            p.vx *= 0.95;
            p.vy *= 0.95;

            p.x += p.vx;
            p.y += p.vy;

            if (Math.random() > 0.85) p.char = getRandomHex();

            ctx.fillStyle = p.color;
            ctx.fillText(p.char, p.x, p.y);
          } else {
            p.type = 'vortex-flung';
            const dx = p.x - ptr.x;
            const dy = p.y - ptr.y;
            const dist = Math.hypot(dx, dy) || 1;

            const force = (5 + Math.random() * 7) * (glitchStrength / 100);
            p.vx = (dx / dist) * force;
            p.vy = (dy / dist) * force;
            p.life = 1.0;
            p.gravity = 0.04;
            p.drag = 0.98;
          }
        }
        
        else if (p.type === 'vortex-flung') {
          p.vy += p.gravity;
          p.vx *= p.drag;
          p.vy *= p.drag;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.015;

          if (p.life <= 0) {
            const cellIdx = p.originRow * cols + p.originCol;
            if (grid[cellIdx]) {
              grid[cellIdx].detached = false;
              grid[cellIdx].state = 'normal';
            }
            activeParticles.splice(i, 1);
            continue;
          }

          ctx.fillStyle = hexToRgba(p.color, p.life);
          ctx.fillText(p.char, p.x, p.y);
        }
        
        else if (p.type === 'shatter') {
          p.vy += 0.22;
          p.vx *= 0.99;
          p.x += p.vx;
          p.y += p.vy;

          p.rotation += p.rotSpeed;
          p.life -= 0.014;

          if (p.x < 0 || p.x > width) {
            p.vx *= -0.7;
            p.x = Math.max(0, Math.min(width, p.x));
          }
          if (p.y > height) {
            p.vy *= -0.6;
            p.vy -= 0.08;
            p.y = height;
          }

          if (p.life <= 0) {
            const cellIdx = p.originRow * cols + p.originCol;
            if (grid[cellIdx]) {
              grid[cellIdx].detached = false;
              grid[cellIdx].state = 'normal';
              grid[cellIdx].char = grid[cellIdx].baseChar;
            }
            activeParticles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.scale(p.scale, p.scale);

          ctx.fillStyle = hexToRgba(p.color, p.life);
          ctx.fillText(p.char, 0, 0);
          ctx.restore();
        }
      }

      frameCount++;
      requestAnimationFrame(animate);
    }

    // Initialization
    resizeGrid();
    
    // Auto-detect theme of site-wide layout
    const savedTheme = localStorage.getItem('ftg-theme') || 'cyber-green';
    const initTheme = savedTheme === 'light' ? 'paper-glitch' : 'cyber-green';
    applyTheme(initTheme);
    
    animate();
  </script>
</body>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Memory Sand</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #3d3527;
        --muted: rgba(61, 53, 39, 0.6);
        --panel: rgba(250, 244, 230, 0.62);
        --panel-solid: rgba(250, 244, 230, 0.86);
        --line: rgba(80, 64, 38, 0.16);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: #c9b487;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      canvas#sand { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
      .vignette {
        position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background: radial-gradient(120% 100% at 50% 45%, rgba(0,0,0,0) 55%, rgba(58,44,20,0.16) 100%);
      }
      header {
        position: fixed; top: clamp(14px, 2.4vw, 26px); left: clamp(14px, 2.6vw, 30px);
        z-index: 4; pointer-events: none;
      }
      h1 {
        margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400;
        font-size: clamp(19px, 2.3vw, 27px); letter-spacing: 0.01em;
        color: rgba(56, 47, 33, 0.78); text-shadow: 0 1px 12px rgba(252,246,228,0.6);
      }
      .meters { margin-top: 9px; display: grid; gap: 6px; width: 132px; }
      .meter { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 7px; }
      .meter span {
        font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
        color: rgba(61, 53, 39, 0.5);
      }
      .bar { height: 2px; background: rgba(80, 64, 38, 0.16); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0%; background: rgba(74, 60, 34, 0.55); transition: width 400ms ease; }

      .dock {
        position: fixed; z-index: 5; left: 50%; bottom: clamp(14px, 2.4vw, 26px);
        transform: translateX(-50%);
        display: flex; align-items: center; gap: 4px; padding: 5px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 14px 40px rgba(66, 50, 22, 0.14);
      }
      .tool {
        width: 46px; height: 42px; display: grid; place-items: center; gap: 2px;
        border: 0; background: transparent; border-radius: 10px; cursor: pointer;
        color: rgba(61, 53, 39, 0.62); transition: background 160ms ease, color 160ms ease;
      }
      .tool svg { width: 19px; height: 19px; }
      .tool b { font-size: 8.5px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; }
      .tool:hover { background: rgba(255, 252, 240, 0.5); color: var(--ink); }
      .tool[aria-pressed="true"] { background: rgba(255, 252, 240, 0.92); color: #352d1d; box-shadow: inset 0 0 0 1px rgba(80,64,38,0.14); }
      .sep { width: 1px; height: 26px; background: var(--line); margin: 0 3px; }
      .sizewrap { display: flex; align-items: center; gap: 7px; padding: 0 8px 0 4px; }
      .sizewrap em { font-style: normal; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(61,53,39,0.5); }
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; height: 18px; }
      input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: rgba(80,64,38,0.22); }
      input[type="range"]::-moz-range-track { height: 2px; background: rgba(80,64,38,0.22); }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
        background: #6d5a35; margin-top: -4.5px; cursor: pointer; border: 0;
      }
      input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #6d5a35; cursor: pointer; }
      #size { width: 76px; }
      .mini {
        width: 34px; height: 34px; display: grid; place-items: center; border: 0; cursor: pointer;
        background: transparent; border-radius: 9px; color: rgba(61,53,39,0.6);
      }
      .mini:hover { background: rgba(255, 252, 240, 0.55); color: var(--ink); }
      .mini svg { width: 16px; height: 16px; }
      .mini[aria-pressed="true"] { background: rgba(255, 252, 240, 0.9); color: #352d1d; }

      .panel {
        position: fixed; z-index: 5; left: 50%; bottom: calc(clamp(14px, 2.4vw, 26px) + 62px);
        transform: translateX(-50%) translateY(6px);
        width: min(430px, calc(100vw - 24px));
        padding: 14px 16px 16px;
        display: grid; gap: 11px;
        background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px;
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 18px 46px rgba(66, 50, 22, 0.16);
        opacity: 0; pointer-events: none; transition: opacity 200ms ease, transform 200ms ease;
      }
      .panel.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
      .row { display: grid; grid-template-columns: 86px 1fr 34px; align-items: center; gap: 10px; }
      .row label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(61,53,39,0.62); }
      .row output { font-size: 10px; text-align: right; color: rgba(61,53,39,0.45); font-variant-numeric: tabular-nums; }
      .chips { display: flex; flex-wrap: wrap; gap: 5px; }
      .chips button {
        border: 1px solid var(--line); background: rgba(255,252,240,0.45); border-radius: 8px;
        padding: 5px 9px; font-size: 10.5px; letter-spacing: 0.04em; cursor: pointer; color: rgba(61,53,39,0.72);
      }
      .chips button[aria-pressed="true"] { background: rgba(109, 90, 53, 0.14); color: #352d1d; border-color: rgba(80,64,38,0.3); }
      .grouptitle { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(61,53,39,0.4); margin-bottom: -4px; }
      .hint {
        position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-size: 12.5px; letter-spacing: 0.05em; color: rgba(58, 47, 30, 0.42);
        pointer-events: none; transition: opacity 1200ms ease; text-align: center; line-height: 1.7;
      }
      .hint.gone { opacity: 0; }
      @media (max-width: 560px) {
        .tool { width: 40px; height: 40px; }
        .tool b { display: none; }
        .sizewrap em { display: none; }
        #size { width: 58px; }
        .meters { width: 104px; }
        .row { grid-template-columns: 70px 1fr 30px; }
      }
    </style>
  </head>
  <body>
    <canvas id="sand"></canvas>
    <div class="vignette"></div>

    <header>
      <h1>Memory Sand</h1>
      <div class="meters">
        <div class="meter"><span>Memory</span><div class="bar"><i id="memBar"></i></div></div>
        <div class="meter"><span>Packed</span><div class="bar"><i id="packBar"></i></div></div>
      </div>
    </header>

    <div class="hint" id="hint">draw slowly to rake · swipe to scatter · hold to press<br />the sand keeps what you do to it</div>

    <div class="panel" id="panel">
      <div class="grouptitle">Sand behaviour</div>
      <div class="row"><label for="settle">Settling</label><input id="settle" type="range" min="0" max="100" value="34" /><output id="settleOut">34</output></div>
      <div class="row"><label for="memory">Memory</label><input id="memory" type="range" min="0" max="100" value="76" /><output id="memoryOut">76</output></div>
      <div class="row"><label for="grain">Grain</label><input id="grain" type="range" min="0" max="100" value="44" /><output id="grainOut">44</output></div>
      <div class="row"><label for="light">Light</label><input id="light" type="range" min="0" max="360" value="308" /><output id="lightOut">308</output></div>
      <div class="row"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="55" /><output id="volumeOut">55</output></div>
      <div class="grouptitle">Material</div>
      <div class="chips" id="themes"></div>
      <div class="grouptitle">Garden</div>
      <div class="chips" id="presets"></div>
    </div>

    <div class="dock">
      <button class="tool" id="t-rake" data-tool="rake" aria-pressed="true" title="Rake — grooved tines (1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M4 5v6M8 5v6M12 5v6M16 5v6M20 5v6" />
          <path d="M3 14c3 1.6 5 1.6 8 0s6-1.6 10 0" />
          <path d="M3 18c3 1.6 5 1.6 8 0s6-1.6 10 0" opacity=".55" />
        </svg><b>Rake</b>
      </button>
      <button class="tool" id="t-finger" data-tool="finger" title="Finger — single soft groove (2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 12V5.4a1.6 1.6 0 0 1 3.2 0V11" />
          <path d="M13.2 11V9.2a1.5 1.5 0 0 1 3 0V12" />
          <path d="M16.2 11.4a1.5 1.5 0 0 1 3 0V15a5.5 5.5 0 0 1-5.5 5.5h-1.4A5.3 5.3 0 0 1 7 18l-2.2-3.4a1.5 1.5 0 0 1 2.4-1.8L10 15.5" />
        </svg><b>Finger</b>
      </button>
      <button class="tool" id="t-stone" data-tool="stone" title="Stone — heavy press and plow (3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <path d="M4.4 14.6 8.6 7.2c.9-1.5 3-1.7 4.2-.5l5.6 5.4c1.5 1.4.9 4-1.1 4.6l-8.2 2.2c-2.3.6-4.3-1.9-3.1-3.9Z" />
          <path d="M8.2 9.6c1.8 1.2 5 3.6 6.6 6.6" opacity=".45" />
        </svg><b>Stone</b>
      </button>
      <button class="tool" id="t-wind" data-tool="wind" title="Wind — erode, drift and bury (4)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M3 8h10a2.6 2.6 0 1 0-2.6-2.6" />
          <path d="M3 12.4h14.4a2.8 2.8 0 1 1-2.8 2.8" />
          <path d="M3 16.8h7" opacity=".55" />
        </svg><b>Wind</b>
      </button>
      <div class="sep"></div>
      <div class="sizewrap"><em>Size</em><input id="size" type="range" min="0" max="100" value="42" /></div>
      <div class="sep"></div>
      <button class="mini" id="undo" title="Undo (U)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h9a5.5 5.5 0 1 1 0 11H8" /><path d="M4 9l4-4M4 9l4 4" />
        </svg>
      </button>
      <button class="mini" id="reset" title="Reset garden (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 5.5v5h-5" /><path d="M19.4 10.5A7.6 7.6 0 1 0 19 15.4" />
        </svg>
      </button>
      <button class="mini" id="sound" aria-pressed="true" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 9.5h3l4-3.2v11.4l-4-3.2H5z" /><path id="wave1" d="M15.2 9.4a3.6 3.6 0 0 1 0 5.2" /><path id="wave2" d="M17.8 7.2a7 7 0 0 1 0 9.6" opacity=".6" />
        </svg>
      </button>
      <button class="mini" id="gear" aria-pressed="false" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.6" /><path d="M12 3.4v2.2M12 18.4v2.2M20.6 12h-2.2M5.6 12H3.4M18.1 5.9l-1.6 1.6M7.5 16.5l-1.6 1.6M18.1 18.1l-1.6-1.6M7.5 7.5 5.9 5.9" />
        </svg>
      </button>
    </div>

    <script>
      (() => {
        "use strict";
        const cv = document.getElementById("sand");
        const ctx = cv.getContext("2d", { alpha: false });
        const $ = (id) => document.getElementById(id);
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const TAU = Math.PI * 2;

        /* ---------- shared simulation state ---------- */
        let W = 0, H = 0, N = 0, cellPx = 6, viewW = 0, viewH = 0;
        let h, base, loose, packed, mem, ghost, dh, dl, sm1, sm2;
        let colR, colG, colB;
        let rw = 0, rh = 0, rcanvas, rctx, rimg, rpix, grainBuf;
        let frame = 0, statTick = 0;

        const undoStack = [];
        const pointers = new Map();

        const THEMES = {
          ivory:  { name: "Ivory",  sand: [226, 214, 186], deep: [166, 150, 118], stone: [154, 152, 145], spec: 0.55, amb: 0.46, sun: 0.72, tintDeep: 0.5 },
          ochre:  { name: "Ochre",  sand: [222, 196, 138], deep: [155, 122, 70],  stone: [150, 138, 112], spec: 0.5,  amb: 0.44, sun: 0.76, tintDeep: 0.55 },
          slate:  { name: "Slate",  sand: [193, 193, 189], deep: [126, 128, 128], stone: [136, 140, 143], spec: 0.72, amb: 0.47, sun: 0.7,  tintDeep: 0.5 },
          clay:   { name: "Clay",   sand: [214, 176, 148], deep: [143, 100, 78],  stone: [151, 129, 116], spec: 0.48, amb: 0.44, sun: 0.75, tintDeep: 0.6 },
          ash:    { name: "Ash",    sand: [205, 201, 196], deep: [128, 124, 124], stone: [116, 116, 120], spec: 0.6,  amb: 0.48, sun: 0.68, tintDeep: 0.52 }
        };
        let theme = THEMES.ivory;

        const S = {
          tool: "rake", size: 42, settle: 34, memory: 76, grain: 44, light: 308,
          volume: 55, sound: true
        };

        /* ---------- noise ---------- */
        function hash2(x, y, s) {
          let n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453;
          return n - Math.floor(n);
        }
        function vnoise(x, y, s) {
          const ix = Math.floor(x), iy = Math.floor(y);
          const fx = x - ix, fy = y - iy;
          const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
          const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
          const c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
          return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
        }
        function fbm(x, y, s) {
          let v = 0, amp = 0.5, f = 1;
          for (let i = 0; i < 4; i++) { v += vnoise(x * f, y * f, s + i) * amp; amp *= 0.5; f *= 2.03; }
          return v;
        }

        /* ---------- grid ---------- */
        function allocate(preserve) {
          const oldW = W, oldH = H, oh = h, ol = loose, op = packed, om = mem, og = ghost, ob = base;
          viewW = window.innerWidth; viewH = window.innerHeight;
          cellPx = viewW < 700 ? 5.4 : 6;
          let w = Math.max(80, Math.round(viewW / cellPx));
          let hh = Math.max(70, Math.round(viewH / cellPx));
          while (w * hh > 42000) { w = Math.round(w * 0.94); hh = Math.round(hh * 0.94); }
          W = w; H = hh; N = W * H;

          h = new Float32Array(N); base = new Float32Array(N); loose = new Float32Array(N);
          packed = new Float32Array(N); mem = new Float32Array(N); ghost = new Float32Array(N);
          dh = new Float32Array(N); dl = new Float32Array(N);
          sm1 = new Float32Array(N); sm2 = new Float32Array(N);
          colR = new Float32Array(N); colG = new Float32Array(N); colB = new Float32Array(N);

          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          cv.width = Math.round(viewW * dpr); cv.height = Math.round(viewH * dpr);
          cv.style.width = viewW + "px"; cv.style.height = viewH + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const rscale = N > 30000 ? 1.7 : 2.1;
          rw = Math.round(W * rscale); rh = Math.round(H * rscale);
          rcanvas = document.createElement("canvas"); rcanvas.width = rw; rcanvas.height = rh;
          rctx = rcanvas.getContext("2d");
          rimg = rctx.createImageData(rw, rh); rpix = rimg.data;
          grainBuf = new Float32Array(rw * rh);
          for (let i = 0; i < grainBuf.length; i++) {
            grainBuf[i] = ((Math.random() + Math.random() + Math.random()) / 3 - 0.5) * 2;
          }

          if (preserve && oh && oldW > 1) {
            for (let y = 0; y < H; y++) {
              const oy = Math.min(oldH - 1, Math.floor((y / H) * oldH));
              for (let x = 0; x < W; x++) {
                const ox = Math.min(oldW - 1, Math.floor((x / W) * oldW));
                const o = oy * oldW + ox, i = y * W + x;
                h[i] = oh[o]; loose[i] = ol[o]; packed[i] = op[o];
                mem[i] = om[o]; ghost[i] = og[o]; base[i] = ob[o];
              }
            }
          } else {
            makeTerrain("karesansui");
          }
        }

        /* ---------- garden presets ---------- */
        function makeTerrain(kind) {
          for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
              const i = y * W + x;
              let v = 0;
              const nx = x / W, ny = y / H;
              if (kind === "dunes") {
                v = Math.sin(x * 0.045 + fbm(x * 0.02, y * 0.02, 3) * 3.4) * 0.85
                  + Math.sin(x * 0.017 - y * 0.03) * 0.5 + fbm(x * 0.05, y * 0.05, 7) * 0.7;
              } else if (kind === "basin") {
                const d = Math.hypot(nx - 0.5, (ny - 0.5) * 1.15);
                v = -Math.cos(clamp(d * 3.0, 0, Math.PI)) * 0.9 - 0.9 + fbm(x * 0.05, y * 0.05, 4) * 0.5;
                v += Math.sin(d * 26) * 0.09;
              } else if (kind === "flat") {
                v = fbm(x * 0.07, y * 0.07, 11) * 0.28;
              } else {
                v = fbm(x * 0.035, y * 0.035, 2) * 0.7 + fbm(x * 0.11, y * 0.11, 5) * 0.18;
              }
              base[i] = v; h[i] = v;
              loose[i] = 0.16; packed[i] = 0; mem[i] = 0; ghost[i] = 0;
            }
          }
          blurInto(h, sm1, 1); h.set(sm1);
          blurInto(h, sm1, 1); h.set(sm1);
          base.set(h);
          if (kind === "karesansui") stampZen();
          if (kind === "dunes") stampRipples();
          if (kind === "basin") stampTerraces();
        }

        function stampZen() {
          const stones = [
            { x: W * 0.3, y: H * 0.38, r: Math.min(W, H) * 0.075 },
            { x: W * 0.62, y: H * 0.62, r: Math.min(W, H) * 0.05 },
            { x: W * 0.72, y: H * 0.3, r: Math.min(W, H) * 0.036 }
          ];
          for (const s of stones) {
            gauss(s.x, s.y, s.r * 2.3, (i, w, dx, dy, d) => {
              const dome = Math.pow(clamp(1 - d, 0, 1), 0.62);
              const lift = dome * s.r * 0.3;
              h[i] += lift; base[i] += lift;
              packed[i] = Math.max(packed[i], dome * 1.0);
              mem[i] = Math.max(mem[i], dome * 1.4);
              loose[i] *= 1 - dome * 0.9;
            });
            for (let ring = 1.9; ring < 5.4; ring += 0.85) {
              const rr = s.r * ring;
              const steps = Math.max(24, Math.round(rr * 5));
              for (let a = 0; a < steps; a++) {
                const t = (a / steps) * TAU;
                const px = s.x + Math.cos(t) * rr, py = s.y + Math.sin(t) * rr * 0.97;
                const v = carve(px, py, 1.7, 0.2, 0.6);
                pile(px + Math.cos(t) * 2.0, py + Math.sin(t) * 2.0, 1.7, v * 0.5);
                pile(px - Math.cos(t) * 2.0, py - Math.sin(t) * 2.0, 1.7, v * 0.5);
                markMem(px, py, 2.0, 0.22);
              }
            }
          }
          for (let y = 2; y < H - 2; y++) {
            for (let x = 2; x < W - 2; x++) {
              const i = y * W + x;
              const far = Math.min(
                Math.hypot(x - stones[0].x, y - stones[0].y) / (stones[0].r * 5.6),
                Math.hypot(x - stones[1].x, y - stones[1].y) / (stones[1].r * 5.6),
                Math.hypot(x - stones[2].x, y - stones[2].y) / (stones[2].r * 5.6)
              );
              if (far > 1) {
                const line = Math.sin(y * 0.62 + Math.sin(x * 0.03) * 1.1);
                const amt = clamp((far - 1) * 1.4, 0, 1);
                h[i] -= clamp(line, -1, 1) * 0.16 * amt;
                mem[i] = Math.max(mem[i], 0.16 * amt);
              }
            }
          }
        }
        function stampRipples() {
          for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
            const i = y * W + x;
            const ph = x * 0.5 + fbm(x * 0.03, y * 0.05, 8) * 6;
            h[i] += Math.sin(ph) * 0.11 + Math.sin(ph * 0.5) * 0.05;
            mem[i] += 0.06;
          }
        }
        function stampTerraces() {
          for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
            const i = y * W + x;
            const q = Math.round(h[i] * 3.2) / 3.2;
            h[i] = h[i] * 0.55 + q * 0.45;
            packed[i] = 0.12;
            mem[i] += 0.1;
          }
        }

        /* ---------- field helpers ---------- */
        function gauss(cx, cy, r, cb) {
          if (r < 0.7) r = 0.7;
          const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(W - 2, Math.ceil(cx + r));
          const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(H - 2, Math.ceil(cy + r));
          const inv = 1 / r, k = 1 / (1 - Math.exp(-3));
          for (let y = y0; y <= y1; y++) {
            const dy = y + 0.5 - cy, row = y * W;
            for (let x = x0; x <= x1; x++) {
              const dx = x + 0.5 - cx;
              const d = Math.sqrt(dx * dx + dy * dy) * inv;
              if (d >= 1) continue;
              const w = (Math.exp(-3 * d * d) - 0.049787) * k;
              if (w <= 0) continue;
              cb(row + x, w, dx, dy, d);
            }
          }
        }
        // resistance keeps grooves from becoming bottomless voids
        function resist(i) {
          const depth = base[i] - h[i];
          return clamp(1 - (depth - 1.4) / 1.7, 0.06, 1) / (1 + packed[i] * 1.7);
        }
        function carve(cx, cy, r, depth, sharp) {
          let vol = 0;
          gauss(cx, cy, r, (i, w) => {
            const ww = sharp ? Math.pow(w, sharp) : w;
            const cut = depth * ww * resist(i);
            h[i] -= cut;
            const d = base[i] - h[i];
            if (d > ghost[i]) ghost[i] = d;
            loose[i] = Math.min(1.4, loose[i] + cut * 0.35);
            vol += cut;
          });
          return vol;
        }
        function pile(cx, cy, r, vol) {
          if (vol <= 0) return;
          let ws = 0;
          gauss(cx, cy, r, (i, w) => { ws += w; });
          if (ws <= 0.0001) return;
          const k = vol / ws;
          gauss(cx, cy, r, (i, w) => {
            h[i] += w * k;
            loose[i] = Math.min(1.6, loose[i] + w * k * 0.8);
          });
        }
        function pileRing(cx, cy, rr, thick, vol, bx, by) {
          const R = rr + thick;
          let ws = 0;
          const wf = (d, dx, dy) => {
            const dist = Math.abs(d * R - rr);
            let w = Math.exp(-(dist * dist) / (thick * thick * 0.8));
            if (bx !== undefined) w *= 1 + 0.55 * ((dx * bx + dy * by) / (R || 1));
            return Math.max(0, w);
          };
          gauss(cx, cy, R, (i, w, dx, dy, d) => { ws += wf(d, dx, dy); });
          if (ws <= 0.0001) return;
          const k = vol / ws;
          gauss(cx, cy, R, (i, w, dx, dy, d) => {
            const a = wf(d, dx, dy) * k;
            h[i] += a; loose[i] = Math.min(1.8, loose[i] + a * 0.9);
          });
        }
        function markMem(cx, cy, r, amt) {
          gauss(cx, cy, r, (i, w) => { mem[i] = Math.min(3.2, mem[i] + amt * w); });
        }
        function compactAt(cx, cy, r, amt) {
          gauss(cx, cy, r, (i, w) => {
            packed[i] = Math.min(1, packed[i] + amt * w);
            loose[i] *= 1 - Math.min(0.5, amt * w * 3);
          });
        }
        function smoothAt(cx, cy, r, amt) {
          const cells = [];
          gauss(cx, cy, r, (i, w) => { cells.push(i, w); });
          for (let k = 0; k < cells.length; k += 2) {
            const i = cells[k], w = cells[k + 1];
            const avg = (h[i - 1] + h[i + 1] + h[i - W] + h[i + W]) * 0.25;
            h[i] += (avg - h[i]) * clamp(amt * w, 0, 0.45);
          }
        }
        function blurInto(src, dst, rad) {
          for (let y = 0; y < H; y++) {
            const row = y * W, ym = y > 0 ? row - W : row, yp = y < H - 1 ? row + W : row;
            for (let x = 0; x < W; x++) {
              const xm = x > 0 ? x - 1 : x, xp = x < W - 1 ? x + 1 : x;
              dst[row + x] = (src[ym + xm] + src[ym + x] * 2 + src[ym + xp] +
                              src[row + xm] * 2 + src[row + x] * 4 + src[row + xp] * 2 +
                              src[yp + xm] + src[yp + x] * 2 + src[yp + xp]) * 0.0625;
            }
          }
        }

        /* ---------- tools : all write to the same fields ---------- */
        function brushRadius() { return (2.6 + (S.size / 100) * 11) * (W / 220 + 0.5); }

        function toolRake(x, y, ux, uy, speed, press, amt) {
          const nx = -uy, ny = ux;
          const size = brushRadius();
          const gsz = 0.75 + (S.grain / 100) * 0.8;
          const tineR = Math.max(1.0, size * 0.17 * gsz);
          const count = Math.max(3, Math.min(9, Math.round(size / (tineR * 1.55))));
          const spread = (count - 1) * 0.5;
          const fast = clamp((speed - 0.45) / 2.0, 0, 1);
          const depth = amt * press * 0.24 * (1 - fast * 0.5);
          for (let k = 0; k < count; k++) {
            const off = (k - spread) * tineR * 1.75;
            const wob = Math.sin(x * 0.09 + y * 0.07 + k * 2.1) * 0.22 + Math.sin(k * 0.9 + frame * 0.01) * 0.1;
            const tx = x + nx * (off + wob), ty = y + ny * (off + wob);
            const ci = cellAt(tx, ty);
            const rep = ci >= 0 ? Math.min(mem[ci], 1.8) : 0;
            const d = depth * (1 + rep * 0.5);
            const vol = carve(tx, ty, tineR * 1.35, d, 1);
            const push = tineR * 1.35;
            pile(tx + nx * push + ux * fast * 1.4, ty + ny * push + uy * fast * 1.4, tineR * 1.25, vol * 0.46);
            pile(tx - nx * push + ux * fast * 1.4, ty - ny * push + uy * fast * 1.4, tineR * 1.25, vol * 0.46);
            markMem(tx, ty, tineR * 1.5, amt * press * 0.05 * (1 - fast * 0.6));
          }
          if (fast > 0.02) scatter(x, y, size * 1.15, ux, uy, fast * amt * 0.55);
          compactAt(x, y, size * 0.55, amt * press * 0.004 * (1 - fast));
        }

        function toolFinger(x, y, ux, uy, speed, press, amt) {
          const nx = -uy, ny = ux;
          const r = brushRadius() * 0.44;
          const fast = clamp((speed - 0.5) / 2.2, 0, 1);
          const depth = amt * press * 0.4 * (1 - fast * 0.35);
          const vol = carve(x, y, r * 1.25, depth, 1);
          pile(x + nx * r * 1.15 + ux * (0.4 + fast * 1.6), y + ny * r * 1.15 + uy * (0.4 + fast * 1.6), r * 1.15, vol * 0.38);
          pile(x - nx * r * 1.15 + ux * (0.4 + fast * 1.6), y - ny * r * 1.15 + uy * (0.4 + fast * 1.6), r * 1.15, vol * 0.38);
          pile(x + ux * r * 1.5, y + uy * r * 1.5, r * 1.1, vol * 0.2 * (0.3 + fast));
          compactAt(x, y, r * 0.95, amt * press * 0.03);
          smoothAt(x, y, r * 1.1, amt * 0.22);
          markMem(x, y, r * 1.3, amt * press * 0.05);
          if (fast > 0.05) scatter(x, y, r * 3.0, ux, uy, fast * amt * 0.4);
        }

        function toolStone(x, y, ux, uy, speed, press, amt, held) {
          const r = brushRadius() * 0.8;
          const moving = speed > 0.12;
          const depth = amt * press * (moving ? 0.35 : 0.5) * (1 + (held || 0) * 0.6);
          const vol = carve(x, y, r, depth, 0.55);
          pileRing(x, y, r * 0.92, r * 0.5, vol * 0.9, moving ? ux : undefined, moving ? uy : undefined);
          compactAt(x, y, r * 0.8, amt * 0.035 * press);
          markMem(x, y, r * 0.95, amt * press * 0.07);
          smoothAt(x, y, r * 0.7, amt * 0.3);
          if (moving) {
            const plow = carve(x + ux * r * 0.75, y + uy * r * 0.75, r * 0.8, amt * press * 0.3, 1);
            pile(x + ux * r * 1.7, y + uy * r * 1.7, r * 0.95, plow * 1.0);
          }
        }

        function toolWind(x, y, ux, uy, speed, press, amt) {
          const r = brushRadius() * 1.5;
          let dx = ux, dy = uy;
          if (dx === 0 && dy === 0) { dx = 1; dy = 0; }
          const strength = clamp(0.25 + speed * 0.6, 0.25, 1.4) * amt;
          const slabs = Math.round(26 * strength) + 6;
          const hop = 2.2 + S.grain * 0.02;
          for (let s = 0; s < slabs; s++) {
            const a = Math.random() * TAU, rad = Math.sqrt(Math.random()) * r;
            const sx = Math.round(x + Math.cos(a) * rad), sy = Math.round(y + Math.sin(a) * rad);
            if (sx < 2 || sy < 2 || sx >= W - 2 || sy >= H - 2) continue;
            const i = sy * W + sx;
            const upwind = h[i] - h[i - (dy > 0.5 ? W : dy < -0.5 ? -W : 0) - (dx > 0.5 ? 1 : dx < -0.5 ? -1 : 0)];
            const exposure = clamp(0.45 + upwind * 0.8, 0.05, 1.2);
            const grip = 1 / (1 + packed[i] * 5 + mem[i] * 1.1);
            if (Math.random() > exposure * grip) continue;
            const slab = (0.035 + Math.random() * 0.05) * strength;
            h[i] -= slab;
            loose[i] = Math.max(0, loose[i] - slab * 0.4);
            let px = sx, py = sy;
            for (let k = 0; k < 4; k++) {
              px += dx * hop + (Math.random() - 0.5) * 1.2;
              py += dy * hop + (Math.random() - 0.5) * 1.2;
              if (px < 2 || py < 2 || px >= W - 2 || py >= H - 2) break;
              const j = (py | 0) * W + (px | 0);
              const shelter = clamp(0.5 + (h[i] - h[j]) * 0.9, 0, 1);
              if (Math.random() < 0.3 + shelter * 0.55 + packed[j] * 0.25) {
                h[j] += slab;
                loose[j] = Math.min(1.8, loose[j] + slab * 0.8);
                break;
              }
            }
          }
          // wind slowly buries loose detail but respects worked, packed material
          const persist = S.memory / 100;
          const cells = [];
          gauss(x, y, r, (i, w) => { cells.push(i, w); });
          for (let k = 0; k < cells.length; k += 2) {
            const i = cells[k], w = cells[k + 1];
            const shield = 1 / (1 + mem[i] * (1.6 + persist * 3.4) + packed[i] * 3);
            const avg = (h[i - 1] + h[i + 1] + h[i - W] + h[i + W]) * 0.25;
            h[i] += (avg - h[i]) * clamp(0.16 * w * amt * shield, 0, 0.4);
            mem[i] *= 1 - 0.0025 * w * amt * (1 - persist * 0.85);
          }
        }

        function scatter(x, y, r, ux, uy, amt) {
          const cells = [];
          let taken = 0;
          gauss(x, y, r, (i, w, dx, dy) => {
            const along = (dx * ux + dy * uy) / r;
            if (along < 0.05) {
              const grab = Math.min(loose[i], 0.05) * w * amt * 1.6;
              if (grab > 0) { h[i] -= grab; loose[i] -= grab; taken += grab; }
            }
            cells.push(i, w, along);
          });
          if (taken <= 0) return;
          let ws = 0;
          for (let k = 0; k < cells.length; k += 3) if (cells[k + 2] > 0.1) ws += cells[k + 1] * cells[k + 2];
          if (ws <= 0.0001) { pile(x + ux * r, y + uy * r, r * 0.7, taken); return; }
          const kk = taken / ws;
          for (let k = 0; k < cells.length; k += 3) {
            if (cells[k + 2] <= 0.1) continue;
            const i = cells[k], add = cells[k + 1] * cells[k + 2] * kk;
            h[i] += add; loose[i] = Math.min(1.8, loose[i] + add);
          }
        }

        function cellAt(x, y) {
          const cx = x | 0, cy = y | 0;
          if (cx < 1 || cy < 1 || cx >= W - 1 || cy >= H - 1) return -1;
          return cy * W + cx;
        }

        /* ---------- taps ---------- */
        function tapAt(tool, x, y, press) {
          const r = brushRadius();
          if (tool === "rake") {
            const count = Math.max(3, Math.min(7, Math.round(r / 2.4)));
            for (let k = 0; k < count; k++) {
              const off = (k - (count - 1) / 2) * (r * 2) / count;
              const v = carve(x + off, y, Math.max(1.1, r * 0.15), 0.22 * press, 1);
              pileRing(x + off, y, r * 0.16, r * 0.16, v * 0.85);
              markMem(x + off, y, r * 0.25, 0.16);
            }
          } else if (tool === "finger") {
            const v = carve(x, y, r * 0.5, 0.4 * press, 0.85);
            pileRing(x, y, r * 0.5, r * 0.28, v * 0.85);
            compactAt(x, y, r * 0.4, 0.09);
            markMem(x, y, r * 0.55, 0.2);
          } else if (tool === "stone") {
            const v = carve(x, y, r * 0.75, 0.55 * press, 0.6);
            pileRing(x, y, r * 0.78, r * 0.38, v * 0.92);
            compactAt(x, y, r * 0.62, 0.22);
            markMem(x, y, r * 0.8, 0.36);
            ripple(x, y, r * 2.2, 0.06);
          } else {
            for (let a = 0; a < TAU; a += TAU / 9) toolWind(x, y, Math.cos(a), Math.sin(a), 0.4, press, 0.5);
          }
        }
        function ripple(x, y, r, amp) {
          gauss(x, y, r, (i, w, dx, dy, d) => {
            h[i] += Math.sin(d * 9.5) * amp * w;
            loose[i] = Math.min(1.8, loose[i] + w * 0.05);
          });
        }

        /* ---------- physics ---------- */
        function step() {
          const settle = S.settle / 100;
          const persist = S.memory / 100;
          const grainF = S.grain / 100;
          const repose = 0.26 + grainF * 0.36;
          const flow = 0.16 + settle * 0.3;

          dh.fill(0); dl.fill(0);
          for (let y = 1; y < H - 1; y++) {
            const row = y * W;
            for (let x = 1; x < W - 2; x++) {
              const i = row + x, j = i + 1;
              const d = h[i] - h[j];
              const ad = d < 0 ? -d : d;
              const th = repose * (1 + (packed[i] + packed[j]) * 1.6 + (mem[i] + mem[j]) * 0.18);
              if (ad > th) {
                const src = d > 0 ? i : j, dst = d > 0 ? j : i;
                let move = (ad - th) * flow * 0.35;
                const avail = loose[src] * 0.5 + 0.015;
                if (move > avail) move = avail;
                dh[src] -= move; dh[dst] += move;
                dl[src] -= move * 0.7; dl[dst] += move * 0.7;
              }
            }
          }
          for (let y = 1; y < H - 2; y++) {
            const row = y * W;
            for (let x = 1; x < W - 1; x++) {
              const i = row + x, j = i + W;
              const d = h[i] - h[j];
              const ad = d < 0 ? -d : d;
              const th = repose * (1 + (packed[i] + packed[j]) * 1.6 + (mem[i] + mem[j]) * 0.18);
              if (ad > th) {
                const src = d > 0 ? i : j, dst = d > 0 ? j : i;
                let move = (ad - th) * flow * 0.35;
                const avail = loose[src] * 0.5 + 0.015;
                if (move > avail) move = avail;
                dh[src] -= move; dh[dst] += move;
                dl[src] -= move * 0.7; dl[dst] += move * 0.7;
              }
            }
          }
          const creep = 0.02 + settle * 0.075;
          const bury = (0.00006 + (1 - persist) * 0.00042) * (0.4 + settle);
          for (let y = 1; y < H - 1; y++) {
            const row = y * W;
            for (let x = 1; x < W - 1; x++) {
              const i = row + x;
              h[i] += dh[i];
              loose[i] = clamp(loose[i] + dl[i], 0, 2.0);
              const shield = 1 / (1 + mem[i] * (1.7 + persist * 4.2) + packed[i] * 2.6);
              const lap = h[i - 1] + h[i + 1] + h[i - W] + h[i + W] - h[i] * 4;
              h[i] += lap * creep * 0.16 * shield * (0.35 + loose[i] * 0.8);
              h[i] += (base[i] - h[i]) * bury * shield;
              loose[i] *= 0.9985;
              mem[i] *= 1 - (1 - persist) * 0.00006;
              packed[i] *= 0.999985;
            }
          }
          // edges mirror so nothing pools at the frame
          for (let x = 0; x < W; x++) {
            h[x] = h[x + W]; h[(H - 1) * W + x] = h[(H - 2) * W + x];
            packed[x] = packed[x + W]; packed[(H - 1) * W + x] = packed[(H - 2) * W + x];
            mem[x] = mem[x + W]; mem[(H - 1) * W + x] = mem[(H - 2) * W + x];
          }
          for (let y = 0; y < H; y++) {
            const r0 = y * W;
            h[r0] = h[r0 + 1]; h[r0 + W - 1] = h[r0 + W - 2];
            packed[r0] = packed[r0 + 1]; packed[r0 + W - 1] = packed[r0 + W - 2];
            mem[r0] = mem[r0 + 1]; mem[r0 + W - 1] = mem[r0 + W - 2];
          }
        }

        /* ---------- shading ---------- */
        function shade() {
          blurInto(h, sm1, 1);
          blurInto(sm1, sm2, 1);
          const ang = (S.light / 180) * Math.PI;
          const lx = Math.cos(ang) * 0.86, ly = Math.sin(ang) * 0.86, lz = 0.52;
          const ll = 1 / Math.sqrt(lx * lx + ly * ly + lz * lz);
          const Lx = lx * ll, Ly = ly * ll, Lz = lz * ll;
          const Hx = Lx, Hy = Ly, Hz = Lz + 1;
          const hl = 1 / Math.sqrt(Hx * Hx + Hy * Hy + Hz * Hz);
          const hx = Hx * hl, hy = Hy * hl, hz = Hz * hl;
          const slope = 3.0;
          const amb = theme.amb, sun = theme.sun;
          const sR = theme.sand[0], sG = theme.sand[1], sB = theme.sand[2];
          const dR = theme.deep[0], dG = theme.deep[1], dB = theme.deep[2];
          const pR = theme.stone[0], pG = theme.stone[1], pB = theme.stone[2];

          for (let y = 0; y < H; y++) {
            const row = y * W;
            const ym = y > 0 ? row - W : row, yp = y < H - 1 ? row + W : row;
            for (let x = 0; x < W; x++) {
              const i = row + x;
              const xm = x > 0 ? i - 1 : i, xp = x < W - 1 ? i + 1 : i;
              const hxm = h[xm] * 0.62 + sm1[xm] * 0.38, hxp = h[xp] * 0.62 + sm1[xp] * 0.38;
              const hym = h[ym + x] * 0.62 + sm1[ym + x] * 0.38, hyp = h[yp + x] * 0.62 + sm1[yp + x] * 0.38;
              let nx = (hxm - hxp) * 0.5 * slope;
              let ny = (hym - hyp) * 0.5 * slope;
              const inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
              const Nx = nx * inv, Ny = ny * inv, Nz = inv;

              const pk = packed[i], mm = mem[i], lo = loose[i];
              const below = clamp(base[i] - h[i], 0, 2.6);
              const above = clamp(h[i] - base[i], 0, 2.0);

              let r = sR, g = sG, b = sB;
              // sand -> packed mineral
              const t = clamp(pk * 1.05, 0, 1);
              r += (pR - r) * t; g += (pG - g) * t; b += (pB - b) * t;
              // exposed lower, damper layers inside cuts
              const dp = clamp(below * 0.42, 0, 1) * theme.tintDeep;
              r += (dR - r) * dp; g += (dG - g) * dp; b += (dB - b) * dp;
              // freshly displaced loose sand is drier / brighter
              const lb = clamp(lo * 0.5, 0, 0.5) + above * 0.06;
              r += lb * 20; g += lb * 18; b += lb * 13;
              // long term memory patina
              const pat = clamp(mm * 0.24, 0, 0.5);
              r -= pat * 24; g -= pat * 19; b -= pat * 10;
              // buried older marks still ghost through
              const heal = clamp(ghost[i] - below, 0, 2.2);
              if (heal > 0.12) {
                const gg = clamp((heal - 0.12) * 0.32, 0, 0.32);
                r -= gg * 20; g -= gg * 16; b -= gg * 9;
              }

              const diff = Math.max(0, Nx * Lx + Ny * Ly + Nz * Lz);
              const sky = 0.55 + 0.45 * Nz;
              const cav = clamp(0.62 + (h[i] - sm2[i]) * 0.75, 0.34, 1.15);
              const spd = Math.max(0, Nx * hx + Ny * hy + Nz * hz);
              const sharpn = 10 + pk * 90 + (1 - clamp(lo, 0, 1)) * 10;
              const spec = Math.pow(spd, sharpn) * (0.03 + pk * theme.spec + mm * 0.02) * 255;
              const light = amb * sky * cav + sun * diff * (0.8 + cav * 0.25);

              colR[i] = clamp(r * light + spec, 0, 255);
              colG[i] = clamp(g * light + spec * 0.99, 0, 255);
              colB[i] = clamp(b * light + spec * 0.94, 0, 255);
            }
          }
        }

        function render() {
          shade();
          const gA = 0.028 + (S.grain / 100) * 0.085;
          const sx = W / rw, sy = H / rh;
          let p = 0;
          for (let py = 0; py < rh; py++) {
            let fy = (py + 0.5) * sy - 0.5;
            let y0 = Math.floor(fy);
            if (y0 < 0) y0 = 0; else if (y0 > H - 2) y0 = H - 2;
            const ty = clamp(fy - y0, 0, 1), ity = 1 - ty;
            const rowA = y0 * W, rowB = rowA + W;
            const gRow = py * rw;
            for (let px = 0; px < rw; px++) {
              let fx = (px + 0.5) * sx - 0.5;
              let x0 = Math.floor(fx);
              if (x0 < 0) x0 = 0; else if (x0 > W - 2) x0 = W - 2;
              const tx = fx - x0 < 0 ? 0 : fx - x0 > 1 ? 1 : fx - x0, itx = 1 - tx;
              const i00 = rowA + x0, i10 = i00 + 1, i01 = rowB + x0, i11 = i01 + 1;
              const w00 = itx * ity, w10 = tx * ity, w01 = itx * ty, w11 = tx * ty;
              let r = colR[i00] * w00 + colR[i10] * w10 + colR[i01] * w01 + colR[i11] * w11;
              let g = colG[i00] * w00 + colG[i10] * w10 + colG[i01] * w01 + colG[i11] * w11;
              let b = colB[i00] * w00 + colB[i10] * w10 + colB[i01] * w01 + colB[i11] * w11;
              const gv = grainBuf[gRow + px];
              const amp = gA * (1 - packed[i00] * 0.72) * (0.6 + loose[i00] * 0.8);
              const m = 1 + gv * amp;
              r *= m; g *= m; b *= m * 0.995;
              rpix[p++] = r < 0 ? 0 : r > 255 ? 255 : r;
              rpix[p++] = g < 0 ? 0 : g > 255 ? 255 : g;
              rpix[p++] = b < 0 ? 0 : b > 255 ? 255 : b;
              rpix[p++] = 255;
            }
          }
          rctx.putImageData(rimg, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(rcanvas, 0, 0, viewW, viewH);
        }

        /* ---------- undo ---------- */
        function snapshot() {
          undoStack.push({
            h: Float32Array.from(h), l: Float32Array.from(loose), p: Float32Array.from(packed),
            m: Float32Array.from(mem), g: Float32Array.from(ghost), W, H
          });
          if (undoStack.length > 9) undoStack.shift();
        }
        function undo() {
          const s = undoStack.pop();
          if (!s || s.W !== W || s.H !== H) return;
          h.set(s.h); loose.set(s.l); packed.set(s.p); mem.set(s.m); ghost.set(s.g);
        }

        /* ---------- audio ---------- */
        let ac = null, master = null, noiseSrc = null, bp = null, bpGain = null, lfo = null, lfoGain = null;
        let tone = { gain: 0, freq: 500, q: 1 };
        function initAudio() {
          if (ac) return;
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          const len = ac.sampleRate * 2;
          const buf = ac.createBuffer(1, len, ac.sampleRate);
          const d = buf.getChannelData(0);
          let last = 0;
          for (let i = 0; i < len; i++) {
            const white = Math.random() * 2 - 1;
            last = last * 0.62 + white * 0.38;
            d[i] = last * 0.9;
          }
          noiseSrc = ac.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
          bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 500; bp.Q.value = 1;
          bpGain = ac.createGain(); bpGain.gain.value = 0;
          master = ac.createGain(); master.gain.value = (S.volume / 100) * (S.sound ? 1 : 0);
          lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 26;
          lfoGain = ac.createGain(); lfoGain.gain.value = 0;
          lfo.connect(lfoGain).connect(bpGain.gain);
          noiseSrc.connect(bp).connect(bpGain).connect(master).connect(ac.destination);
          noiseSrc.start(); lfo.start();
        }
        function setTone(tool, speed, press) {
          if (!ac) return;
          if (tool === "rake") { tone.freq = 900 + speed * 1400; tone.q = 1.6; tone.gain = 0.05 + speed * 0.1 + press * 0.02; lfo.frequency.value = clamp(18 + speed * 55, 12, 90); lfoGain.gain.value = tone.gain * 0.5; }
          else if (tool === "finger") { tone.freq = 340 + speed * 520; tone.q = 0.8; tone.gain = 0.035 + speed * 0.06; lfoGain.gain.value = 0; }
          else if (tool === "stone") { tone.freq = 180 + speed * 340; tone.q = 1.1; tone.gain = 0.055 + speed * 0.1; lfo.frequency.value = clamp(8 + speed * 22, 6, 40); lfoGain.gain.value = tone.gain * 0.35; }
          else { tone.freq = 700 + speed * 900; tone.q = 0.55; tone.gain = 0.05 + speed * 0.07; lfoGain.gain.value = 0; }
        }
        function audioTick(active) {
          if (!ac) return;
          const t = ac.currentTime;
          if (!active) tone.gain *= 0.86;
          bpGain.gain.setTargetAtTime(clamp(tone.gain, 0, 0.2), t, 0.07);
          bp.frequency.setTargetAtTime(tone.freq, t, 0.05);
          bp.Q.value = tone.q;
          if (!active) { tone.freq += (300 - tone.freq) * 0.05; if (lfoGain) lfoGain.gain.value *= 0.85; }
        }
        function click(force, low) {
          if (!ac || !S.sound) return;
          const len = Math.floor(ac.sampleRate * 0.08);
          const buf = ac.createBuffer(1, len, ac.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, low ? 2.6 : 4.5);
          const src = ac.createBufferSource(); src.buffer = buf;
          const f = ac.createBiquadFilter(); f.type = low ? "lowpass" : "bandpass";
          f.frequency.value = low ? 320 + force * 380 : 900 + force * 1400;
          const g = ac.createGain(); g.gain.value = 0.045 + force * 0.06;
          src.connect(f).connect(g).connect(master); src.start();
        }

        /* ---------- pointer handling ---------- */
        function toGrid(e) { return { x: (e.clientX / viewW) * W, y: (e.clientY / viewH) * H }; }

        function onDown(e) {
          e.preventDefault();
          if (pointers.size === 0) snapshot();
          if (S.sound) { initAudio(); if (ac && ac.state === "suspended") ac.resume(); }
          const g = toGrid(e);
          pointers.set(e.pointerId, {
            x: g.x, y: g.y, ox: g.x, oy: g.y, ux: 0, uy: 0, t: performance.now(),
            t0: performance.now(), hold: 0, moved: 0, press: e.pressure && e.pressure > 0 ? 0.4 + e.pressure * 0.8 : 0.85,
            turn: 0, ang: null
          });
          try { cv.setPointerCapture(e.pointerId); } catch (_) {}
          $("hint").classList.add("gone");
          if (S.tool !== "wind") click(S.tool === "stone" ? 0.85 : 0.35, S.tool === "stone");
        }

        function onMove(e) {
          const p = pointers.get(e.pointerId);
          if (!p) return;
          e.preventDefault();
          const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
          for (const ev of evs) applyMove(p, ev);
        }

        function applyMove(p, e) {
          const now = performance.now();
          const g = toGrid(e);
          const dt = Math.max(6, now - p.t);
          let dx = g.x - p.x, dy = g.y - p.y;
          const dist = Math.hypot(dx, dy);
          p.press = e.pressure && e.pressure > 0 ? 0.4 + e.pressure * 0.8 : p.press;
          if (dist < 0.0001) { p.t = now; return; }
          const speed = clamp(dist / dt * 8, 0, 4);
          const ux = dx / dist, uy = dy / dist;
          if (p.ang !== null) {
            let da = Math.atan2(uy, ux) - p.ang;
            while (da > Math.PI) da -= TAU;
            while (da < -Math.PI) da += TAU;
            p.turn = p.turn * 0.9 + da;
          }
          p.ang = Math.atan2(uy, ux);
          p.moved += dist;

          const stepLen = 0.55;
          const steps = Math.min(64, Math.max(1, Math.ceil(dist / stepLen)));
          const amt = clamp(dist / steps, 0.1, 1.2) * 1.15;
          // curved gestures bite a little deeper on the inside of the arc
          const curveBoost = 1 + clamp(Math.abs(p.turn) * 0.5, 0, 0.5);
          for (let s = 1; s <= steps; s++) {
            const t = s / steps;
            const x = p.x + dx * t, y = p.y + dy * t;
            applyTool(S.tool, x, y, ux, uy, speed, p.press * curveBoost, amt, 0);
          }
          p.ux = ux; p.uy = uy; p.x = g.x; p.y = g.y; p.t = now;
          setTone(S.tool, clamp(speed * 0.5, 0, 1.6), p.press);
        }

        function onUp(e) {
          const p = pointers.get(e.pointerId);
          if (!p) return;
          const dur = performance.now() - p.t0;
          if (p.moved < 1.6 && dur < 420) {
            tapAt(S.tool, p.x, p.y, clamp(p.press, 0.5, 1.4));
            click(S.tool === "stone" ? 1 : 0.5, S.tool === "stone" || S.tool === "finger");
          } else if (p.hold > 26 && S.tool !== "wind") {
            ripple(p.x, p.y, brushRadius() * 2.4, 0.035);
          }
          pointers.delete(e.pointerId);
        }

        function applyTool(tool, x, y, ux, uy, speed, press, amt, held) {
          if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) return;
          if (tool === "rake") toolRake(x, y, ux, uy, speed, press, amt);
          else if (tool === "finger") toolFinger(x, y, ux, uy, speed, press, amt);
          else if (tool === "stone") toolStone(x, y, ux, uy, speed, press, amt, held);
          else toolWind(x, y, ux, uy, speed, press, amt);
        }

        /* ---------- main loop ---------- */
        function loop() {
          frame++;
          let active = false;
          for (const p of pointers.values()) {
            const idle = performance.now() - p.t;
            if (idle > 26) {
              p.hold++;
              active = true;
              const held = clamp(p.hold / 60, 0, 1.4);
              if (S.tool === "wind") {
                const a = p.ang === null ? frame * 0.004 : p.ang + Math.sin(frame * 0.01) * 0.25;
                applyTool("wind", p.x, p.y, Math.cos(a), Math.sin(a), 0.12, p.press, 0.45, held);
                setTone("wind", 0.25, p.press);
              } else if (S.tool === "stone") {
                applyTool("stone", p.x, p.y, 0, 0, 0, p.press, 0.16 * (1 - held * 0.45), held);
                setTone("stone", 0.05, p.press);
              } else if (S.tool === "finger") {
                applyTool("finger", p.x, p.y, p.ux, p.uy, 0, p.press, 0.12 * (1 - held * 0.5), held);
                compactAt(p.x, p.y, brushRadius() * 0.5, 0.012);
                setTone("finger", 0.04, p.press);
              } else {
                applyTool("rake", p.x, p.y, p.ux || 1, p.uy || 0, 0, p.press, 0.09 * (1 - held * 0.5), held);
                compactAt(p.x, p.y, brushRadius() * 0.6, 0.006);
                setTone("rake", 0.03, p.press);
              }
            } else active = true;
          }
          step();
          audioTick(active);
          render();
          if (++statTick > 24) { statTick = 0; updateMeters(); }
          requestAnimationFrame(loop);
        }

        function updateMeters() {
          let m = 0, pk = 0;
          const stride = 7;
          let n = 0;
          for (let i = 0; i < N; i += stride) { m += Math.min(mem[i], 2); pk += packed[i]; n++; }
          $("memBar").style.width = clamp((m / n) * 90, 0, 100) + "%";
          $("packBar").style.width = clamp((pk / n) * 200, 0, 100) + "%";
        }

        /* ---------- UI ---------- */
        const toolBtns = [...document.querySelectorAll(".tool")];
        function selectTool(t) {
          S.tool = t;
          toolBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
        }
        toolBtns.forEach((b) => b.addEventListener("click", () => selectTool(b.dataset.tool)));

        const bind = (id, key, fmt) => {
          const el = $(id), out = $(id + "Out");
          const sync = () => { S[key] = el.valueAsNumber; if (out) out.textContent = fmt ? fmt(el.valueAsNumber) : el.valueAsNumber; };
          el.addEventListener("input", sync); sync();
        };
        bind("settle", "settle"); bind("memory", "memory"); bind("grain", "grain");
        bind("light", "light", (v) => v + "°"); bind("volume", "volume"); bind("size", "size");
        $("volume").addEventListener("input", () => { if (master) master.gain.value = (S.volume / 100) * (S.sound ? 1 : 0); });

        const themesEl = $("themes");
        Object.keys(THEMES).forEach((k) => {
          const b = document.createElement("button");
          b.textContent = THEMES[k].name;
          b.setAttribute("aria-pressed", String(THEMES[k] === theme));
          b.addEventListener("click", () => {
            theme = THEMES[k];
            [...themesEl.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
          });
          themesEl.appendChild(b);
        });

        const PRESETS = [["karesansui", "Karesansui"], ["dunes", "Dunes"], ["basin", "Basin"], ["flat", "Still"]];
        const presetsEl = $("presets");
        let currentPreset = "karesansui";
        PRESETS.forEach(([k, label]) => {
          const b = document.createElement("button");
          b.textContent = label;
          b.setAttribute("aria-pressed", String(k === currentPreset));
          b.addEventListener("click", () => {
            snapshot(); currentPreset = k; makeTerrain(k);
            [...presetsEl.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
          });
          presetsEl.appendChild(b);
        });

        $("undo").addEventListener("click", undo);
        $("reset").addEventListener("click", () => { snapshot(); makeTerrain(currentPreset); });
        $("gear").addEventListener("click", () => {
          const open = $("panel").classList.toggle("open");
          $("gear").setAttribute("aria-pressed", String(open));
        });
        $("sound").addEventListener("click", () => {
          S.sound = !S.sound;
          $("sound").setAttribute("aria-pressed", String(S.sound));
          $("wave1").style.opacity = S.sound ? "1" : "0.12";
          $("wave2").style.opacity = S.sound ? "0.6" : "0.08";
          if (S.sound) { initAudio(); if (ac && ac.state === "suspended") ac.resume(); }
          if (master) master.gain.value = (S.volume / 100) * (S.sound ? 1 : 0);
        });

        window.addEventListener("keydown", (e) => {
          const k = e.key.toLowerCase();
          if (k === "1") selectTool("rake");
          else if (k === "2") selectTool("finger");
          else if (k === "3") selectTool("stone");
          else if (k === "4") selectTool("wind");
          else if (k === "u" || ((e.metaKey || e.ctrlKey) && k === "z")) undo();
          else if (k === "r") { snapshot(); makeTerrain(currentPreset); }
        });

        cv.addEventListener("pointerdown", onDown, { passive: false });
        cv.addEventListener("pointermove", onMove, { passive: false });
        cv.addEventListener("pointerup", onUp);
        cv.addEventListener("pointercancel", onUp);
        window.addEventListener("blur", () => { for (const id of [...pointers.keys()]) pointers.delete(id); });
        cv.addEventListener("contextmenu", (e) => e.preventDefault());
        let rt;
        window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => allocate(true), 160); });

        allocate(false);
        setTimeout(() => $("hint").classList.add("gone"), 9000);
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>

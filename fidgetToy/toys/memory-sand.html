            rpix[p++] = g < 0 ? 0 : g > 255 ? 255 : g;
            rpix[p++] = b < 0 ? 0 : b > 255 ? 255 : b;
            rpix[p++] = 255;
          }
        }
        rctx.putImageData(rimg, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(rcanvas, 0, 0, viewW, viewH);
        drawCursor();
        drawSignature();
      }

      /* ---------- the engraving ----------
         The bow of the key is a few cells across, far too small to carve letters
         into the heightfield, so the engraving is drawn over the finished frame in
         CSS pixels — the same layer the cursor uses. */
      const SIGNATURE = "sand tended by claude opus 5";
      const SIG_FONT = "12px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif";
      // laid out once and kept: nothing about it changes until the canvas resizes
      // or a new garden plants a new key
      let sigLayout = null;
      function layoutSignature(key) {
        ctx.font = SIG_FONT;
        const track = 2.6;               // canvas has no letter-spacing
        const chars = [...SIGNATURE];
        const adv = chars.map((c) => ctx.measureText(c).width + track);
        const wide = adv.reduce((a, b) => a + b, 0) - track;
        const rad = (propGrid(key).r / W) * viewW;
        // a key planted near an edge must not push its own engraving off-canvas
        const cx = clamp(key.nx * viewW, wide / 2 + 12, viewW - wide / 2 - 12);
        const y = clamp(key.ny * viewH + rad * 2.8 + 14, 16, viewH - 14);
        const xs = [];
        let x = cx - wide / 2;
        for (const a of adv) { xs.push(x); x += a; }
        return { chars, xs, y, key, w: viewW, h: viewH };
      }
      function drawSignature() {
        // ease in over roughly a second so it surfaces rather than pops
        const want = keyPolish > 0.995 ? 1 : 0;
        sigFade += (want - sigFade) * 0.05;
        if (sigFade < 0.01) return;
        const key = keyProp();
        if (!key) return;
        if (!sigLayout || sigLayout.key !== key || sigLayout.w !== viewW || sigLayout.h !== viewH) {
          sigLayout = layoutSignature(key);
        }
        const { chars, xs, y } = sigLayout;
        ctx.save();
        ctx.font = SIG_FONT;
        ctx.textBaseline = "middle";
        // struck twice: a dark bite, then the bright metal it turned up
        const dark = "rgba(48,38,22," + (0.5 * sigFade).toFixed(3) + ")";
        const brass = "rgba(238,206,140," + (0.92 * sigFade).toFixed(3) + ")";
        ctx.fillStyle = dark;
        for (let i = 0; i < chars.length; i++) ctx.fillText(chars[i], xs[i] + 1, y + 1);
        ctx.fillStyle = brass;
        for (let i = 0; i < chars.length; i++) ctx.fillText(chars[i], xs[i], y);
        ctx.restore();
      }

      /* ---------- tool cursor ----------
         Each tool draws its own shape, so the size slider is legible before you
         commit a stroke and Finger and Stone are told apart on sight. */
      const hover = { x: -1, y: -1, ux: 1, uy: 0, on: false };
      const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      function drawCursor() {
        if (coarse || !hover.on || hover.x < 0) return;
        const px = (hover.x / W) * viewW, py = (hover.y / H) * viewH;
        const rad = (brushRadius() / W) * viewW;
        const ux = hover.ux, uy = hover.uy, nx = -uy, ny = ux;
        ctx.save();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(58,47,30,0.4)";
        ctx.fillStyle = "rgba(58,47,30,0.22)";
        if (S.tool === "rake") {
          const n = 5;
          for (let k = 0; k < n; k++) {
            const o = (k - (n - 1) / 2) * (rad * 2) / n;
            ctx.beginPath();
            ctx.moveTo(px + nx * o - ux * 5, py + ny * o - uy * 5);
            ctx.lineTo(px + nx * o + ux * 5, py + ny * o + uy * 5);
            ctx.stroke();
          }
        } else if (S.tool === "finger") {
          ctx.beginPath(); ctx.arc(px, py, rad * 0.55, 0, TAU); ctx.fill();
          ctx.globalAlpha = 0.45;
          ctx.beginPath(); ctx.arc(px, py, rad * 1.15, 0, TAU); ctx.stroke();
        } else if (S.tool === "stone") {
          ctx.globalAlpha = 0.28;
          ctx.beginPath(); ctx.arc(px + 2.5, py + 3, rad * 0.85, 0, TAU); ctx.fill();
          ctx.globalAlpha = 1; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(px, py, rad * 0.85, 0, TAU); ctx.stroke();
        } else if (S.tool === "wind") {
          ctx.globalAlpha = 0.5;
          const a = Math.atan2(uy, ux);
          for (let k = 0; k < 3; k++) {
            ctx.beginPath();
            ctx.arc(px - ux * k * 5, py - uy * k * 5, rad * (1.3 - k * 0.22), a - 0.8, a + 0.8);
            ctx.stroke();
          }
        } else {
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(px, py, rad * 0.72, 0, TAU); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.35;
          ctx.beginPath(); ctx.arc(px, py, 2, 0, TAU); ctx.fill();
        }
        ctx.restore();
      }

      /* ---------- undo ---------- */
      function snapshot() {
        undoStack.push({
          h: Float32Array.from(h), l: Float32Array.from(loose), p: Float32Array.from(packed),
          m: Float32Array.from(mem), g: Float32Array.from(ghost), gl: Float32Array.from(gloss),
          b: Float32Array.from(base),
          props: props.map((p) => Object.assign({}, p)), W, H
        });
        if (undoStack.length > 9) undoStack.shift();
      }
      function undo() {
        const s = undoStack.pop();
        if (!s || s.W !== W || s.H !== H) return;
        h.set(s.h); loose.set(s.l); packed.set(s.p); mem.set(s.m); ghost.set(s.g); gloss.set(s.gl);
        base.set(s.b);
        props.length = 0;
        for (const p of s.props) props.push(p);
        rasterizeProps();
      }

      /* ---------- audio ---------- */
      let ac = null, master = null, noiseSrc = null, bp = null, bpGain = null, lfo = null, lfoGain = null;
      let tone = { gain: 0, freq: 500, q: 1 };
      function initAudio() {
        if (ac) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        const len = ac.sampleRate * 2;
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < len; i++) {
          const white = Math.random() * 2 - 1;
          last = last * 0.62 + white * 0.38;
          d[i] = last * 0.9;
        }
        noiseSrc = ac.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
        bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 500; bp.Q.value = 1;
        bpGain = ac.createGain(); bpGain.gain.value = 0;
        master = ac.createGain(); master.gain.value = (S.volume / 100) * (S.sound ? 1 : 0);
        lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 26;
        lfoGain = ac.createGain(); lfoGain.gain.value = 0;
        lfo.connect(lfoGain).connect(bpGain.gain);
        noiseSrc.connect(bp).connect(bpGain).connect(master).connect(ac.destination);
        noiseSrc.start(); lfo.start();
      }
      function setTone(tool, speed, press) {
        if (!ac) return;
        if (tool === "rake") { tone.freq = 900 + speed * 1400; tone.q = 1.6; tone.gain = 0.05 + speed * 0.1 + press * 0.02; lfo.frequency.value = clamp(18 + speed * 55, 12, 90); lfoGain.gain.value = tone.gain * 0.5; }
        // finger is a soft high shush that rides up with speed; stone is a low grind
        else if (tool === "finger") { tone.freq = 1500 + speed * 2400; tone.q = 0.45; tone.gain = 0.026 + speed * 0.05; lfoGain.gain.value = 0; }
        else if (tool === "stone") { tone.freq = 130 + speed * 240; tone.q = 1.4; tone.gain = 0.07 + speed * 0.11; lfo.frequency.value = clamp(6 + speed * 16, 5, 32); lfoGain.gain.value = tone.gain * 0.45; }
        else if (tool === "post") { tone.gain = 0; lfoGain.gain.value = 0; }
        else { tone.freq = 700 + speed * 900; tone.q = 0.55; tone.gain = 0.05 + speed * 0.07; lfoGain.gain.value = 0; }
      }
      function audioTick(active) {
        if (!ac) return;
        const t = ac.currentTime;
        if (!active) tone.gain *= 0.86;
        bpGain.gain.setTargetAtTime(clamp(tone.gain, 0, 0.2), t, 0.07);
        bp.frequency.setTargetAtTime(tone.freq, t, 0.05);
        bp.Q.value = tone.q;
        if (!active) { tone.freq += (300 - tone.freq) * 0.05; if (lfoGain) lfoGain.gain.value *= 0.85; }
      }
      function click(force, low) {
        if (!ac || !S.sound) return;
        const len = Math.floor(ac.sampleRate * 0.08);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, low ? 2.6 : 4.5);
        const src = ac.createBufferSource(); src.buffer = buf;
        const f = ac.createBiquadFilter(); f.type = low ? "lowpass" : "bandpass";
        f.frequency.value = low ? 320 + force * 380 : 900 + force * 1400;
        const g = ac.createGain(); g.gain.value = 0.045 + force * 0.06;
        src.connect(f).connect(g).connect(master); src.start();
      }
      // dull wooden knock when a tool runs into a post — rate-limited so a rake
      // dragged along a pylon taps rather than buzzes
      let lastKnock = 0;
      function knock(force) {
        if (!ac || !S.sound) return;
        const t = ac.currentTime;
        if (t - lastKnock < 0.07) return;
        lastKnock = t;
        const o = ac.createOscillator(); o.type = "triangle";
        o.frequency.setValueAtTime(190 + force * 120, t);
        o.frequency.exponentialRampToValueAtTime(78, t + 0.09);
        const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.03 + force * 0.05, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);

      }
      // stone finding metal: a short dull tap, damped by the sand around it. Says
      // "there's something here", deliberately not "you've won something".
      function tink() {
        if (!ac || !S.sound) return;
        knock(0.5);
        const t = ac.currentTime;
        const o = ac.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(1240, t);
        o.frequency.exponentialRampToValueAtTime(880, t + 0.16);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.035, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g).connect(master); o.start(t); o.stop(t + 0.26);
      }
      // the one sound in the piece that isn't sand — held back for the signature
      function chime() {
        if (!ac || !S.sound) return;
        const t = ac.currentTime;
        [1, 2.02, 3.01].forEach((mul, k) => {
          const o = ac.createOscillator(); o.type = "sine";
          o.frequency.value = 784 * mul;
          const g = ac.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.05 / (k + 1.4), t + 0.01 + k * 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5 + k * 0.4);
          o.connect(g).connect(master); o.start(t); o.stop(t + 2.2);
        });
      }

      /* ---------- pointer handling ---------- */
      function toGrid(e) { return { x: (e.clientX / viewW) * W, y: (e.clientY / viewH) * H }; }

      function onDown(e) {
        e.preventDefault();
        if (pointers.size === 0) snapshot();
        if (S.sound) { initAudio(); if (ac && ac.state === "suspended") ac.resume(); }
        const g = toGrid(e);
        pointers.set(e.pointerId, {
          x: g.x, y: g.y, ox: g.x, oy: g.y, ux: 0, uy: 0, t: performance.now(),
          t0: performance.now(), hold: 0, moved: 0, press: e.pressure && e.pressure > 0 ? 0.4 + e.pressure * 0.8 : 0.85,
          turn: 0, ang: null
        });
        try { cv.setPointerCapture(e.pointerId); } catch (_) { }
        $("hint").classList.add("gone");
        if (S.tool !== "wind" && S.tool !== "post") click(S.tool === "stone" ? 0.85 : 0.35, S.tool === "stone");
      }

      function onMove(e) {
        const p = pointers.get(e.pointerId);
        if (!p) {
          // no button down: just track the cursor so the overlay can follow
          const g = toGrid(e);
          const dx = g.x - hover.x, dy = g.y - hover.y;
          const d = Math.hypot(dx, dy);
          if (d > 0.4) { hover.ux = dx / d; hover.uy = dy / d; }
          hover.x = g.x; hover.y = g.y; hover.on = true;
          return;
        }
        e.preventDefault();
        const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of evs) applyMove(p, ev);
      }

      function applyMove(p, e) {
        const now = performance.now();
        const g = toGrid(e);
        const dt = Math.max(6, now - p.t);
        let dx = g.x - p.x, dy = g.y - p.y;
        const dist = Math.hypot(dx, dy);
        p.press = e.pressure && e.pressure > 0 ? 0.4 + e.pressure * 0.8 : p.press;
        if (dist < 0.0001) { p.t = now; return; }
        const speed = clamp(dist / dt * 8, 0, 4);
        const ux = dx / dist, uy = dy / dist;
        if (p.ang !== null) {
          let da = Math.atan2(uy, ux) - p.ang;
          while (da > Math.PI) da -= TAU;
          while (da < -Math.PI) da += TAU;
          p.turn = p.turn * 0.9 + da;
        }
        p.ang = Math.atan2(uy, ux);
        p.moved += dist;
        hover.x = g.x; hover.y = g.y; hover.ux = ux; hover.uy = uy; hover.on = true;
        // the post tool only acts on tap — dragging it just moves the marker
        if (S.tool === "post") { p.x = g.x; p.y = g.y; p.t = now; return; }

        const stepLen = 0.55;
        const steps = Math.min(64, Math.max(1, Math.ceil(dist / stepLen)));
        const amt = clamp(dist / steps, 0.1, 1.2) * 1.15;
        // curved gestures bite a little deeper on the inside of the arc
        const curveBoost = 1 + clamp(Math.abs(p.turn) * 0.5, 0, 0.5);
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          const x = p.x + dx * t, y = p.y + dy * t;
          applyTool(S.tool, x, y, ux, uy, speed, p.press * curveBoost, amt, 0);
        }
        p.ux = ux; p.uy = uy; p.x = g.x; p.y = g.y; p.t = now;
        setTone(S.tool, clamp(speed * 0.5, 0, 1.6), p.press);
      }

      function onUp(e) {
        const p = pointers.get(e.pointerId);
        if (!p) return;
        const dur = performance.now() - p.t0;
        // the post tool always acts on release — it's a placement, not a stroke
        if (S.tool === "post") {
          tapAt("post", p.x, p.y, 1);
        } else if (p.moved < 1.6 && dur < 420) {
          tapAt(S.tool, p.x, p.y, clamp(p.press, 0.5, 1.4));
          click(S.tool === "stone" ? 1 : 0.5, S.tool === "stone" || S.tool === "finger");
        } else if (p.hold > 26 && S.tool !== "wind") {
          ripple(p.x, p.y, brushRadius() * 2.4, 0.035);
        }
        pointers.delete(e.pointerId);
      }

      function applyTool(tool, x, y, ux, uy, speed, press, amt, held) {
        if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) return;
        if (tool === "rake") toolRake(x, y, ux, uy, speed, press, amt);
        else if (tool === "finger") toolFinger(x, y, ux, uy, speed, press, amt);
        else if (tool === "stone") toolStone(x, y, ux, uy, speed, press, amt, held);
        else if (tool === "post") return;
        else toolWind(x, y, ux, uy, speed, press, amt);
      }

      /* ---------- main loop ---------- */
      function loop() {
        frame++;
        let active = false;
        for (const p of pointers.values()) {
          const idle = performance.now() - p.t;
          if (idle > 26) {
            p.hold++;
            active = true;
            const held = clamp(p.hold / 60, 0, 1.4);
            if (S.tool === "wind") {
              const a = p.ang === null ? frame * 0.004 : p.ang + Math.sin(frame * 0.01) * 0.25;
              applyTool("wind", p.x, p.y, Math.cos(a), Math.sin(a), 0.12, p.press, 0.45, held);
              setTone("wind", 0.25, p.press);
            } else if (S.tool === "stone") {
              // weight keeps working: it settles deeper the longer you lean on it
              applyTool("stone", p.x, p.y, 0, 0, 0, p.press, 0.18, held);
              setTone("stone", 0.05, p.press);
            } else if (S.tool === "finger") {
              // held still, a fingertip stops digging and starts polishing
              markGloss(p.x, p.y, brushRadius("finger") * 1.1, 0.055 * p.press);
              smoothAt(p.x, p.y, brushRadius("finger") * 1.3, 0.09);
              compactAt(p.x, p.y, brushRadius("finger") * 0.6, 0.004);
              setTone("finger", 0.04, p.press);
            } else if (S.tool === "post") {
              active = true;
            } else {
              applyTool("rake", p.x, p.y, p.ux || 1, p.uy || 0, 0, p.press, 0.09 * (1 - held * 0.5), held);
              compactAt(p.x, p.y, brushRadius() * 0.6, 0.006);
              setTone("rake", 0.03, p.press);
            }
          } else active = true;
        }
        step();
        audioTick(active);
        render();
        if (++statTick > 24) { statTick = 0; updateMeters(); checkKey(); }
        requestAnimationFrame(loop);
      }

      // Has the sand over the key been cleared? Checked a few times a second, not
      // every frame — and it re-hides itself just as quietly if you bury it again.
      function checkKey() {
        const key = keyProp();
        if (!key || !key.cells || !key.cells.length) return;
        // Ask the metal, not the neighbourhood: what share of the key is in the
        // open? Averaging a box around it just measured the sand beside the pit.
        let clear = 0;
        for (const i of key.cells) if (h[i] <= key.top + 0.02) clear++;
        // hysteresis, or a key sitting right at the threshold flickers
        const uncovered = clear / key.cells.length > (key.buried ? 0.45 : 0.28);
        if (uncovered !== !key.buried) {
          key.buried = !uncovered;
          // finding it is a tink of metal, not a reward — the reward is one beat later
          if (uncovered && !keySeen) { keySeen = true; tink(); }
          /* Going back under only happens by undo: once the key is exposed its own
             cells stop the sand flowing, so nothing settles on it again. Undoing
             the dig should undo the shine with it — but the latches stay set, so
             neither sound can be farmed. */
          if (!uncovered) keyPolish = 0;
        }
        if (uncovered && keyPolish > 0.995 && !keySigned) { keySigned = true; chime(); }
      }

      function updateMeters() {
        let m = 0, pk = 0;
        const stride = 7;
        let n = 0;
        for (let i = 0; i < N; i += stride) { m += Math.min(mem[i], 2); pk += packed[i]; n++; }
        $("memBar").style.width = clamp((m / n) * 90, 0, 100) + "%";
        $("packBar").style.width = clamp((pk / n) * 200, 0, 100) + "%";
      }

      /* ---------- UI ---------- */
      const toolBtns = [...document.querySelectorAll(".tool")];
      function selectTool(t) {
        S.tool = t;
        toolBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === t)));
      }
      toolBtns.forEach((b) => b.addEventListener("click", () => selectTool(b.dataset.tool)));

      const bind = (id, key, fmt) => {
        const el = $(id), out = $(id + "Out");
        const sync = () => { S[key] = el.valueAsNumber; if (out) out.textContent = fmt ? fmt(el.valueAsNumber) : el.valueAsNumber; };
        el.addEventListener("input", sync); sync();
      };
      bind("settle", "settle"); bind("memory", "memory"); bind("grain", "grain");
      bind("light", "light", (v) => v + "°"); bind("volume", "volume"); bind("size", "size");
      $("volume").addEventListener("input", () => { if (master) master.gain.value = (S.volume / 100) * (S.sound ? 1 : 0); });

      const themesEl = $("themes");
      Object.keys(THEMES).forEach((k) => {
        const b = document.createElement("button");
        b.textContent = THEMES[k].name;
        b.setAttribute("aria-pressed", String(THEMES[k] === theme));
        b.addEventListener("click", () => {
          theme = THEMES[k];
          // the garden stays exactly as you worked it — only the material changes,
          // so the same pattern can be compared across all five
          buildGrain();
          [...themesEl.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
        });
        themesEl.appendChild(b);
      });

      const PRESETS = [["karesansui", "Karesansui"], ["pilings", "Pilings"], ["dunes", "Dunes"], ["basin", "Basin"], ["flat", "Still"]];
      const presetsEl = $("presets");
      let currentPreset = "karesansui";
      PRESETS.forEach(([k, label]) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.setAttribute("aria-pressed", String(k === currentPreset));
        b.addEventListener("click", () => {
          snapshot(); currentPreset = k; makeTerrain(k);
          [...presetsEl.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
        });
        presetsEl.appendChild(b);
      });

      $("undo").addEventListener("click", undo);
      $("reset").addEventListener("click", () => { snapshot(); makeTerrain(currentPreset); });
      $("gear").addEventListener("click", () => {
        const open = $("panel").classList.toggle("open");
        $("gear").setAttribute("aria-pressed", String(open));
      });
      $("sound").addEventListener("click", () => {
        S.sound = !S.sound;
        $("sound").setAttribute("aria-pressed", String(S.sound));
        $("wave1").style.opacity = S.sound ? "1" : "0.12";
        $("wave2").style.opacity = S.sound ? "0.6" : "0.08";
        if (S.sound) { initAudio(); if (ac && ac.state === "suspended") ac.resume(); }
        if (master) master.gain.value = (S.volume / 100) * (S.sound ? 1 : 0);
      });

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "1") selectTool("rake");
        else if (k === "2") selectTool("finger");
        else if (k === "3") selectTool("stone");
        else if (k === "4") selectTool("wind");
        else if (k === "5") selectTool("post");
        else if (k === "u" || ((e.metaKey || e.ctrlKey) && k === "z")) undo();
        else if (k === "r") { snapshot(); makeTerrain(currentPreset); }
      });

      cv.addEventListener("pointerdown", onDown, { passive: false });
      cv.addEventListener("pointermove", onMove, { passive: false });
      cv.addEventListener("pointerup", onUp);
      cv.addEventListener("pointercancel", onUp);
      cv.addEventListener("pointerleave", () => { hover.on = false; });
      cv.addEventListener("pointerenter", () => { hover.on = true; });
      window.addEventListener("blur", () => { for (const id of [...pointers.keys()]) pointers.delete(id); });
      cv.addEventListener("contextmenu", (e) => e.preventDefault());
      let rt;
      window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => allocate(true), 160); });

      // keep the settings panel clear of the dock even when it wraps to two rows
      const dockEl = document.querySelector(".dock");
      const syncDock = () => document.documentElement.style.setProperty("--dockh", (dockEl.offsetHeight + 10) + "px");
      if (window.ResizeObserver) new ResizeObserver(syncDock).observe(dockEl);
      window.addEventListener("resize", syncDock);

      allocate(false);
      syncDock();
      setTimeout(() => $("hint").classList.add("gone"), 9000);
      requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>

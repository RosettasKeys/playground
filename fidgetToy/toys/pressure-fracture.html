    function drawLoadField(ax, ay, hx, hy, p, now, axis) {
      const dx = hx - ax, dy = hy - ay, dist = Math.hypot(dx, dy);
      const tone = accent();
      ctx.save();
      for (let i = 0; i < 3; i++) {
        const ph = ((now / 1350) + i / 3) % 1;
        ctx.beginPath();
        ctx.arc(ax, ay, 18 + ph * (42 + p * 68 + dist * .12), 0, 6.2832);
        ctx.strokeStyle = tone;
        ctx.globalAlpha = (1 - ph) * .32;
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }
      if (dist > 8) {
        ctx.globalAlpha = 0.32;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        const sag = Math.sin(now * .012) * Math.min(18, dist * .06);
        ctx.quadraticCurveTo((ax + hx) / 2 - dy / dist * sag, (ay + hy) / 2 + dx / dist * sag, hx, hy);
        ctx.strokeStyle = tone; ctx.lineWidth = 1.2 + p;
        ctx.setLineDash([9, 10]); ctx.stroke(); ctx.setLineDash([]);
      }
      if (axis) {
        const L = Math.max(W, H);
        ctx.globalAlpha = 0.2;
        ctx.setLineDash([2, 9]);
        ctx.beginPath();
        ctx.moveTo(axis.x - Math.cos(axis.a) * L, axis.y - Math.sin(axis.a) * L);
        ctx.lineTo(axis.x + Math.cos(axis.a) * L, axis.y + Math.sin(axis.a) * L);
        ctx.strokeStyle = tone; ctx.lineWidth = 1; ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.globalAlpha = 0.8;
      ctx.beginPath();
      ctx.arc(hx, hy, (5 + p * 6) * (1 + Math.sin(now * .018) * .14), 0, 6.2832);
      ctx.strokeStyle = tone; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.restore();
    }

    function drawBits(now) {
      ctx.save();
      for (let i = bits.length - 1; i >= 0; i--) {
        const p = bits[i], age = now - p.born;
        if (age > p.life) { bits.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy; p.vx *= .972; p.vy = p.vy * .972 + p.gravity;
        ctx.globalAlpha = (1 - age / p.life) * .85;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + p.color + ',.9)'; ctx.fill();
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════════════════════════
    // UI
    // ══════════════════════════════════════════════════════════════
    let statusTimer = null;
    function setStatus(text, revert) {
      statusEl.textContent = text;
      clearTimeout(statusTimer);
      if (revert) statusTimer = setTimeout(defaultStatus, revert);
    }
    function defaultStatus() { statusEl.textContent = MAT[material].hint; }

    function applyTheme() {
      const m = MAT[material];
      panel.style.setProperty('--accent', TOK[m.tok]);
      subEl.textContent = m.name + ' · ' + STRESS[stress].name;
      readoutEl.innerHTML = '<b>' + m.name + ' · ' + STRESS[stress].name + '</b><br />' +
        m.blurb + ' ' + STRESS[stress].blurb;
      defaultStatus();
    }

    function clearSurface() {
      segs = []; fractures = []; forks = []; shocks = []; traces = []; bits = []; marks = []; crazes = [];
      occupied = new Set();
      rig = null;
    }

    function setMaterial(mat) {
      if (!MAT[mat] || mat === material) return;
      material = mat;
      document.querySelectorAll('[data-mat]').forEach(b => b.classList.toggle('is-on', b.dataset.mat === mat));
      clearSurface(); bake(); applyTheme();
      haptic(14);
    }

    function setStress(st) {
      if (!STRESS[st] || st === stress) return;
      stress = st;
      document.querySelectorAll('[data-stress]').forEach(b => b.classList.toggle('is-on', b.dataset.stress === st));
      applyTheme();
      haptic(10);
    }

    document.querySelectorAll('[data-mat]').forEach(b => b.addEventListener('click', () => setMaterial(b.dataset.mat)));
    document.querySelectorAll('[data-stress]').forEach(b => b.addEventListener('click', () => setStress(b.dataset.stress)));

    const panelToggle = document.getElementById('panel-toggle');
    panelToggle.addEventListener('click', () => {
      const c = panel.classList.toggle('is-collapsed');
      panelToggle.textContent = c ? '❮' : '❯';
      panelToggle.setAttribute('aria-expanded', String(!c));
    });

    const bind = (id, outId, fmt, apply) => {
      const el = document.getElementById(id), out = document.getElementById(outId);
      el.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        out.textContent = fmt(v);
        apply(v);
      });
    };
    bind('s-force', 'v-force', v => v.toFixed(1) + '×', v => forceScale = v);
    bind('s-branch', 'v-branch', v => v === 0 ? 'None' : v.toFixed(1) + '×', v => branchScale = v);
    bind('s-speed', 'v-speed', v => v.toFixed(1) + '×', v => speedScale = v);
    bind('s-brittle', 'v-brittle',
      v => v < -0.05 ? 'Ductile ' + v.toFixed(1) : v > 0.05 ? 'Brittle +' + v.toFixed(1) : 'Native',
      v => brittleBias = v);
    bind('s-life', 'v-life', v => v.toFixed(1) + 's', v => persistence = v * 1000);

    document.getElementById('c-debris').addEventListener('change', e => { showDebris = e.target.checked; });
    document.getElementById('c-field').addEventListener('change', e => { showField = e.target.checked; });
    document.getElementById('c-residue').addEventListener('change', e => { showResidue = e.target.checked; });
    document.getElementById('c-haptic').addEventListener('change', e => { useHaptics = e.target.checked; });

    document.getElementById('reset-btn').addEventListener('click', () => {
      clearSurface();
      setStatus('Surface reset.', 2600);
      haptic([10, 20, 10]);
    });

    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === '1') setMaterial('glass');
      else if (k === '2') setMaterial('ice');
      else if (k === '3') setMaterial('metal');
      else if (k === '4') setMaterial('plastic');
      else if (k === 'q') setStress('impact');
      else if (k === 'w') setStress('shear');
      else if (k === 'e') setStress('thermal');
      else if (k === 'r') setStress('flex');
      else if (k === 'm') soundToggle.click();
      else if (k === 'h') panelToggle.click();
      else if (k === 'x') document.getElementById('reset-btn').click();
    });

    // ── Pointer ────────────────────────────────────────────────────
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      rig = new RIGS[material](p.x, p.y);
      if (material !== 'glass') tick(0.3);
      clearTimeout(statusTimer);
    });
    canvas.addEventListener('pointermove', e => { if (rig) { const p = pos(e); rig.onMove(p.x, p.y); } });
    const endPtr = () => { if (!rig) return; rig.onRelease(); rig = null; };
    canvas.addEventListener('pointerup', endPtr);
    canvas.addEventListener('pointercancel', endPtr);

    // ══════════════════════════════════════════════════════════════
    // Deliberately ignores the rAF timestamp. That timestamp is the frame's
    // start time, but everything here stamps `born` with performance.now()
    // from inside an event handler — which runs *after* the frame started.
    // Mixing the two makes age briefly negative, and anything that guards on
    // `t < 0` (the shockwave) or ramps from zero (the fracture) silently
    // skips a frame. One clock for everyone.
    function loop() {
      // Re-armed first, not last: if anything below ever throws, the toy
      // should stutter and recover rather than freeze for good.
      requestAnimationFrame(loop);
      const now = performance.now();
      ctx.drawImage(bg, 0, 0, bg.width, bg.height, 0, 0, W, H);

      if (rig) rig.update(now);
      for (let i = forks.length - 1; i >= 0; i--) {
        forks[i].update();
        if (forks[i].dead) forks.splice(i, 1);
      }
      if (segs.length) segs = segs.filter(c => now - c.born < c.life);
      fractures = fractures.filter(f => !f.dead);
      shocks = shocks.filter(s => !s.dead);
      traces = traces.filter(t => !t.dead);

      drawMarks(now);
      drawSegs(now);
      for (const t of traces) t.draw(now);
      for (const s of shocks) s.draw(now);
      for (const f of fractures) f.draw(now);
      drawCrazes(now);
      drawBits(now);
      if (rig) rig.drawOverlay(now);
    }

    // ── Init ───────────────────────────────────────────────────────
    new MutationObserver(() => { readTokens(); applyTheme(); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    window.addEventListener('resize', resize);
    readTokens();
    resize();
    applyTheme();
    requestAnimationFrame(loop);

    console.log(
      '%c◇ Pressure Fracture%c\n' +
      'Four materials, four loads, one surface that always heals.\n' +
      'Built by Claude Opus 5, via Claude Code.\n' +
      "Hold glass past everything you've got — a flickering salamander signs its own work.",
      'color:#36f7ff;font-weight:700;font-size:13px',
      'color:#a9b0c0;font-size:11px'
    );
  </script>
</body>

</html>

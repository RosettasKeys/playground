<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tension Threads | Fidget Toy Garden</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    body.toy-page {
      overflow: hidden;
      background: #160000;
    }

    #threads-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }

    #threads-canvas.pulling {
      cursor: grabbing;
    }

    .tension-meter {
      position: fixed;
      z-index: 4;
      right: 18px;
      bottom: 82px;
      width: 8px;
      height: min(180px, 28vh);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(7, 8, 12, 0.58);
      pointer-events: none;
      backdrop-filter: blur(18px);
    }

    .tension-meter span {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 0%;
      border-radius: inherit;
      background: linear-gradient(to top, #006eff 0%, #ffd10f 48%, #fa500f 76%, #ff910f 100%);
      box-shadow: 0 0 22px rgba(255, 0, 55, 0.72);
      transition: height 80ms linear;
    }
  </style>
</head>

<body class="toy-page">
  <nav class="toy-nav" aria-label="Toy controls">
    <a class="back-link" href="../fidgetToy-index.html">Home</a>
    <button class="sound-toggle" type="button" aria-label="Toggle sound" aria-pressed="false">♪</button>
  </nav>

  <canvas id="threads-canvas" aria-label="A field of elastic glowing threads that stretch, snap, and heal"></canvas>
  <div class="tension-meter" aria-hidden="true"><span id="tension-fill"></span></div>

  <div class="toy-status" aria-live="polite">
    <p id="status-text">Grab the knot. Pull or shake until something gives.</p>
  </div>

  <script>
    const canvas = document.getElementById('threads-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const soundToggle = document.querySelector('.sound-toggle');
    const statusText = document.getElementById('status-text');
    const tensionFill = document.getElementById('tension-fill');

    let width = 0;
    let height = 0;
    let dpr = 1;
    let lastTime = performance.now();
    let globalTension = 0;
    let statusMode = 'idle';
    let audio = null;
    let soundEnabled = false;
    let lastCreak = 0;
    let lastHaptic = 0;
    let ripCharge = 0;
    let ripCooldown = 0;
    let rippedUntil = 0;
    let brokenThreadCount = 0;

    const nodes = [];
    const threads = [];
    const sparks = [];
    const egg = {
      x: 0,
      y: 0,
      radius: 0,
      reveal: 0,
      carrier: 0,
      decodeCharge: 0,
      flash: 0,
      decoded: false,
      lastShakeDirection: 0,
      revealThreshold: 0.18,
      decodeThreshold: 0.34,
      signature: 'OpenAI GPT-5.5',
    };
    const pointer = {
      x: 0,
      y: 0,
      px: 0,
      py: 0,
      vx: 0,
      vy: 0,
      shake: 0,
      active: false,
      grabbed: [],
    };

    const palette = {
      cool: [0, 150, 255],
      warm: [255, 209, 15],
      hot: [250, 79, 16],
      white: [255, 145, 15],
    };

    function mixColor(a, b, amount) {
      return a.map((value, index) => Math.round(value + (b[index] - value) * amount));
    }

    function tensionColor(tension, alpha = 1) {
      let color;
      if (tension < 0.55) color = mixColor(palette.cool, palette.warm, tension / 0.55);
      else if (tension < 0.86) color = mixColor(palette.warm, palette.hot, (tension - 0.55) / 0.31);
      else color = mixColor(palette.hot, palette.white, (tension - 0.86) / 0.14);
      return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
    }

    function buildThreads() {
      nodes.length = 0;
      threads.length = 0;
      brokenThreadCount = 0;
      egg.reveal = 0;
      egg.carrier = 0;
      egg.decodeCharge = 0;
      egg.flash = 0;
      egg.decoded = false;
      egg.lastShakeDirection = 0;

      const spacing = Math.max(76, Math.min(118, Math.sqrt((width * height) / 90)));
      const cols = Math.ceil(width / spacing) + 2;
      const rows = Math.ceil(height / spacing) + 2;
      const startX = (width - (cols - 1) * spacing) / 2;
      const startY = (height - (rows - 1) * spacing) / 2;

      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const edge = row === 0 || col === 0 || row === rows - 1 || col === cols - 1;
          const x = startX + col * spacing + (Math.random() - 0.5) * spacing * 0.46;
          const y = startY + row * spacing + (Math.random() - 0.5) * spacing * 0.46;
          nodes.push({
            x,
            y,
            homeX: x,
            homeY: y,
            vx: 0,
            vy: 0,
            pinned: edge,
            detachedUntil: 0,
          });
        }
      }

      const addThread = (aIndex, bIndex) => {
        const a = nodes[aIndex];
        const b = nodes[bIndex];
        const length = Math.hypot(b.x - a.x, b.y - a.y);
        threads.push({
          a,
          b,
          rest: length * (0.84 + Math.random() * 0.08),
          tension: 0,
          broken: false,
          heal: 0,
          countedForEgg: false,
          seed: Math.random() * Math.PI * 2,
        });
      };

      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const i = row * cols + col;
          if (col < cols - 1) addThread(i, i + 1);
          if (row < rows - 1) addThread(i, i + cols);
          if (row < rows - 1 && col < cols - 1 && Math.random() > 0.45) addThread(i, i + cols + 1);
          if (row < rows - 1 && col > 0 && Math.random() > 0.72) addThread(i, i + cols - 1);
        }
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      egg.x = width * 0.5;
      egg.y = height * 0.53;
      egg.radius = Math.max(72, Math.min(156, Math.min(width, height) * 0.18));
      buildThreads();
    }

    function makeAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      const context = new AudioContext();
      const master = context.createGain();
      master.gain.value = 0.64;
      master.connect(context.destination);
      return { context, master };
    }

    async function toggleSound() {
      if (!audio) audio = makeAudio();
      if (!audio) {
        statusText.textContent = 'This browser does not support Web Audio.';
        return;
      }
      if (audio.context.state === 'suspended') await audio.context.resume();
      soundEnabled = !soundEnabled;
      soundToggle.setAttribute('aria-pressed', String(soundEnabled));
      soundToggle.textContent = soundEnabled ? '♫' : '♪';
    }

    function playCreak(tension) {
      if (!soundEnabled || !audio || performance.now() - lastCreak < 90) return;
      lastCreak = performance.now();
      const now = audio.context.currentTime;
      const osc = audio.context.createOscillator();
      const gain = audio.context.createGain();
      const filter = audio.context.createBiquadFilter();
      const duration = 0.12 + tension * 0.12;

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(54 + tension * 86 + Math.random() * 24, now);
      osc.frequency.linearRampToValueAtTime(72 + tension * 140, now + duration);
      filter.type = 'lowpass';
      filter.frequency.value = 320 + tension * 1200;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.012 + tension * 0.024, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audio.master);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playSnap(tension) {
      if (!soundEnabled || !audio) return;
      const now = audio.context.currentTime;
      const osc = audio.context.createOscillator();
      const gain = audio.context.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520 + Math.random() * 760, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.16);
      gain.gain.setValueAtTime(0.12 + tension * 0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      osc.connect(gain);
      gain.connect(audio.master);
      osc.start(now);
      osc.stop(now + 0.2);
    }

    function vibrate(pattern) {
      if (!navigator.vibrate || performance.now() - lastHaptic < 55) return;
      lastHaptic = performance.now();
      navigator.vibrate(pattern);
    }

    function addSparks(x, y, tension) {
      for (let i = 0; i < 8 + Math.round(tension * 10); i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 5.2;
        sparks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color: tensionColor(tension),
        });
      }
    }

    function brokenThreadRatio() {
      return threads.length ? brokenThreadCount / threads.length : 0;
    }

    function registerEggBreak(thread) {
      if (thread.countedForEgg) return;
      thread.countedForEgg = true;
      brokenThreadCount += 1;

      const ratio = brokenThreadRatio();
      if (ratio >= egg.revealThreshold && egg.reveal < 0.12) egg.flash = 0.9;
      if (ratio >= egg.decodeThreshold && egg.carrier < 0.2) egg.flash = 1.1;
    }

    function snapThread(thread) {
      if (thread.broken) return;
      thread.broken = true;
      thread.heal = 160 + Math.random() * 220;
      registerEggBreak(thread);
      const x = (thread.a.x + thread.b.x) / 2;
      const y = (thread.a.y + thread.b.y) / 2;
      const dx = thread.b.x - thread.a.x;
      const dy = thread.b.y - thread.a.y;
      thread.a.vx -= dx * 0.055;
      thread.a.vy -= dy * 0.055;
      thread.b.vx += dx * 0.055;
      thread.b.vy += dy * 0.055;
      addSparks(x, y, thread.tension);
      playSnap(thread.tension);
      vibrate([12, 24, 18]);
    }

    function ripChunk(now) {
      if (!pointer.grabbed.length || ripCooldown > 0) return;

      const center = pointer.grabbed[0].node;
      const cluster = new Set(
        nodes
          .map(node => ({ node, distance: Math.hypot(node.x - center.x, node.y - center.y) }))
          .filter(item => !item.node.pinned && item.distance < 150)
          .sort((a, b) => a.distance - b.distance)
          .slice(0, 12)
          .map(item => item.node)
      );
      if (cluster.size < 4) return;

      const boundary = threads.filter(thread => cluster.has(thread.a) !== cluster.has(thread.b) && !thread.broken);
      if (boundary.length < 3) return;

      const impulseX = pointer.vx * 0.55;
      const impulseY = pointer.vy * 0.55;
      for (const node of cluster) {
        node.detachedUntil = now + 6200;
        node.vx += impulseX + (node.x - center.x) * 0.025;
        node.vy += impulseY + (node.y - center.y) * 0.025;
      }

      for (const thread of threads) {
        if (cluster.has(thread.a) && cluster.has(thread.b)) {
          thread.rest = Math.hypot(thread.b.x - thread.a.x, thread.b.y - thread.a.y);
          thread.tension = Math.min(thread.tension, 0.32);
        }
      }

      for (const thread of boundary) {
        snapThread(thread);
        thread.heal = 360 + Math.random() * 120;
      }

      pointer.grabbed = pointer.grabbed.filter(item => cluster.has(item.node));
      rippedUntil = now + 1800;
      ripCharge = 0;
      ripCooldown = 420;
      vibrate([24, 32, 42, 24, 18]);
    }

    function grab(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = pointer.px = event.clientX - rect.left;
      pointer.y = pointer.py = event.clientY - rect.top;
      pointer.vx = 0;
      pointer.vy = 0;
      pointer.shake = 0;
      pointer.active = true;
      pointer.grabbed = nodes
        .map(node => ({ node, distance: Math.hypot(node.x - pointer.x, node.y - pointer.y) }))
        .filter(item => !item.node.pinned && item.distance < 130)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 7)
        .map(item => ({ node: item.node, offsetX: item.node.x - pointer.x, offsetY: item.node.y - pointer.y }));
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add('pulling');
      vibrate(12);
    }

    function move(event) {
      const rect = canvas.getBoundingClientRect();
      const previousVx = pointer.vx;
      const previousVy = pointer.vy;
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;
      pointer.vx = pointer.x - pointer.px;
      pointer.vy = pointer.y - pointer.py;
      const speed = Math.hypot(pointer.vx, pointer.vy);
      const previousSpeed = Math.hypot(previousVx, previousVy);
      if (speed > 5 && previousSpeed > 5) {
        const directionChange = 1 - (pointer.vx * previousVx + pointer.vy * previousVy) / (speed * previousSpeed);
        pointer.shake += Math.max(0, directionChange) * Math.min(speed, 65);
      }
    }

    function release() {
      pointer.active = false;
      pointer.grabbed = [];
      pointer.shake = 0;
      canvas.classList.remove('pulling');
    }

    function updateEgg(step) {
      const ratio = brokenThreadRatio();
      const revealTarget = ratio >= egg.revealThreshold ? 1 : Math.max(0, ratio / egg.revealThreshold - 0.68) * 0.22;
      const carrierTarget = Math.min(1, Math.max(0, (ratio - egg.revealThreshold) / (egg.decodeThreshold - egg.revealThreshold)));

      egg.reveal += (revealTarget - egg.reveal) * 0.055 * step;
      egg.carrier += (carrierTarget - egg.carrier) * 0.075 * step;

      if (!egg.decoded && ratio >= egg.decodeThreshold && pointer.active) {
        const speed = Math.hypot(pointer.vx, pointer.vy);
        const direction = Math.abs(pointer.vx) > Math.abs(pointer.vy) ? Math.sign(pointer.vx) : Math.sign(pointer.vy);
        const reversed = direction && egg.lastShakeDirection && direction !== egg.lastShakeDirection;
        if (direction) egg.lastShakeDirection = direction;

        const shakeInput = Math.min(1, pointer.shake / 42);
        const speedInput = Math.min(1, speed / 46);
        const reversalBoost = reversed ? 0.036 : 0.012;
        egg.decodeCharge += (shakeInput * 0.018 + speedInput * reversalBoost) * step;
        if (egg.decodeCharge >= 1) {
          egg.decodeCharge = 1;
          egg.decoded = true;
          egg.flash = 1.55;
          addSparks(egg.x, egg.y, 1);
          vibrate([30, 34, 64, 24]);
        }
      } else if (!egg.decoded) {
        egg.decodeCharge *= Math.pow(0.988, step);
      }

      egg.flash *= Math.pow(0.92, step);
    }

    function updateStatus() {
      let nextMode = 'idle';
      let text = 'Grab the knot. Pull or shake until something gives.';
      if (egg.decoded) {
        nextMode = 'egg-decoded';
        text = 'The signal has a name.';
      } else if (egg.carrier > 0.72) {
        nextMode = 'egg-carrier';
        text = pointer.active ? 'Hold the noise steady.' : 'Something is answering.';
      } else if (egg.reveal > 0.72) {
        nextMode = 'egg';
        text = 'Something is answering.';
      } else if (performance.now() < rippedUntil) {
        nextMode = 'ripped';
        text = 'You tore it loose.';
      } else if (pointer.active && globalTension < 0.25) {
        nextMode = 'pull';
        text = 'Pull.';
      } else if (globalTension < 0.55 && pointer.active) {
        nextMode = 'resist';
        text = 'It will not move.';
      } else if (globalTension < 0.82 && pointer.active) {
        nextMode = 'harder';
        text = 'Harder.';
      } else if (globalTension >= 0.82) {
        nextMode = 'snap';
        text = 'There it goes.';
      }
      if (statusMode !== nextMode) {
        statusMode = nextMode;
        statusText.textContent = text;
      }
      tensionFill.style.height = `${Math.round(globalTension * 100)}%`;
    }

    function updatePhysics(dt, now) {
      const step = Math.min(2, dt / 16.67);
      let highestTension = 0;
      ripCooldown = Math.max(0, ripCooldown - step);

      if (pointer.active) {
        const speed = Math.hypot(pointer.vx, pointer.vy);
        for (const grabbed of pointer.grabbed) {
          const targetX = pointer.x + grabbed.offsetX * 0.2;
          const targetY = pointer.y + grabbed.offsetY * 0.2;
          grabbed.node.vx += (targetX - grabbed.node.x) * (0.022 + Math.min(speed, 55) * 0.0005) * step;
          grabbed.node.vy += (targetY - grabbed.node.y) * (0.022 + Math.min(speed, 55) * 0.0005) * step;
        }

        const pullForce = globalTension > 0.64 ? (globalTension - 0.64) * (0.8 + Math.min(speed, 45) * 0.04) : 0;
        const shakeForce = pointer.shake * 0.014;
        ripCharge += (pullForce + shakeForce) * step;
        if (ripCharge > 18) ripChunk(now);
      } else {
        ripCharge *= Math.pow(0.94, step);
      }
      pointer.shake *= Math.pow(0.72, step);
      pointer.vx *= Math.pow(0.82, step);
      pointer.vy *= Math.pow(0.82, step);

      for (const thread of threads) {
        if (thread.broken) {
          thread.heal -= step;
          if (thread.heal <= 0) {
            thread.broken = false;
            thread.tension = 0;
          }
          continue;
        }

        const dx = thread.b.x - thread.a.x;
        const dy = thread.b.y - thread.a.y;
        const distance = Math.max(0.001, Math.hypot(dx, dy));
        const stretch = Math.max(0, distance / thread.rest - 1);
        thread.tension += (Math.min(1, stretch / 0.72) - thread.tension) * 0.16 * step;
        highestTension = Math.max(highestTension, thread.tension);

        const force = (distance - thread.rest) * 0.012;
        const fx = (dx / distance) * force;
        const fy = (dy / distance) * force;
        if (!thread.a.pinned) {
          thread.a.vx += fx * step;
          thread.a.vy += fy * step;
        }
        if (!thread.b.pinned) {
          thread.b.vx -= fx * step;
          thread.b.vy -= fy * step;
        }

        if (thread.tension > 0.48) {
          const tremble = (thread.tension - 0.48) * 0.7;
          const jitter = Math.sin(now * 0.035 + thread.seed) * tremble;
          if (!thread.a.pinned) thread.a.vy += jitter;
          if (!thread.b.pinned) thread.b.vx -= jitter;
        }

        if (thread.tension > 0.62 && Math.random() < thread.tension * 0.025) playCreak(thread.tension);
        if (thread.tension > 0.93 && Math.random() < (thread.tension - 0.9) * 0.24 * step) snapThread(thread);
      }

      globalTension += (highestTension - globalTension) * 0.13 * step;
      updateEgg(step);

      for (const node of nodes) {
        if (node.pinned) continue;
        const detached = node.detachedUntil > now;
        if (detached) {
          node.vy += 0.012 * step;
          node.vx *= Math.pow(0.975, step);
          node.vy *= Math.pow(0.975, step);
        } else {
          node.vx += (node.homeX - node.x) * 0.0007 * step;
          node.vy += (node.homeY - node.y) * 0.0007 * step;
          node.vx *= Math.pow(0.91, step);
          node.vy *= Math.pow(0.91, step);
        }
        node.x += node.vx * step;
        node.y += node.vy * step;
      }

      if (globalTension > 0.72 && pointer.active) vibrate(Math.round(4 + globalTension * 7));
      updateStatus();
    }

    function drawBackground(now) {
      const gradient = ctx.createRadialGradient(
        width * 0.5,
        height * 0.48,
        0,
        width * 0.5,
        height * 0.48,
        Math.max(width, height) * 0.72
      );
      gradient.addColorStop(0, '#180a01');
      gradient.addColorStop(0.55, '#070912');
      gradient.addColorStop(1, '#2c0e02');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = `rgba(255, 79, 116, ${globalTension * 0.025 * (1 + Math.sin(now * 0.018))})`;
      ctx.fillRect(0, 0, width, height);
    }

    function drawSignalEgg(now) {
      if (egg.reveal <= 0.01) return;

      const reveal = egg.reveal * egg.reveal * (3 - 2 * egg.reveal);
      const carrier = egg.carrier * egg.carrier * (3 - 2 * egg.carrier);
      const decode = egg.decoded ? 1 : egg.decodeCharge;
      const pulse = 1 + Math.sin(now * 0.0045 + carrier * 4) * (0.018 + carrier * 0.018) + egg.flash * 0.055;
      const rx = egg.radius * 0.76 * pulse;
      const ry = egg.radius * 1.04 * pulse;
      const phase = now * 0.0032 + carrier * 7 + decode * 3;

      ctx.save();
      ctx.translate(egg.x, egg.y);
      ctx.rotate(Math.sin(now * 0.0012) * 0.045 * (1 - decode * 0.6));
      ctx.globalAlpha = reveal;

      const halo = ctx.createRadialGradient(0, 0, ry * 0.08, 0, 0, ry * (1.65 + egg.flash * 0.25));
      halo.addColorStop(0, `rgba(52, 247, 255, ${0.12 + carrier * 0.22 + egg.flash * 0.14})`);
      halo.addColorStop(0.46, `rgba(255, 209, 15, ${0.05 + carrier * 0.11})`);
      halo.addColorStop(1, 'rgba(52, 247, 255, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * 1.95, ry * 1.55, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      const core = ctx.createRadialGradient(-rx * 0.12, -ry * 0.22, 0, 0, 0, ry);
      core.addColorStop(0, `rgba(246, 252, 255, ${0.06 + reveal * 0.08 + decode * 0.12})`);
      core.addColorStop(0.42, `rgba(29, 136, 187, ${0.12 + carrier * 0.18})`);
      core.addColorStop(0.75, `rgba(24, 10, 1, ${0.56 - decode * 0.14})`);
      core.addColorStop(1, 'rgba(6, 8, 16, 0.94)');
      ctx.fillStyle = core;
      ctx.fillRect(-rx, -ry, rx * 2, ry * 2);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = -18; i <= 18; i += 1) {
        const y = (i / 18) * ry;
        const edge = Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))) * rx;
        const wobble = Math.sin(phase + i * 0.72) * (10 - decode * 7);
        const gap = Math.sin(phase * 1.7 + i * 1.9) > 0.45 - carrier * 0.45 ? edge * 0.22 * (1 - decode) : 0;
        ctx.globalAlpha = reveal * (0.08 + carrier * 0.22 + decode * 0.18) * (1 - Math.abs(i) / 26);
        ctx.strokeStyle = i % 3 === 0 ? '#ffd10f' : '#36f7ff';
        ctx.lineWidth = 0.9 + carrier * 1.1 + decode * 0.7;
        ctx.beginPath();
        ctx.moveTo(-edge + wobble, y);
        ctx.lineTo(-gap + wobble * 0.35, y + Math.sin(phase + i) * 2);
        ctx.moveTo(gap + wobble * 0.35, y + Math.cos(phase + i) * 2);
        ctx.lineTo(edge + wobble, y);
        ctx.stroke();
      }

      for (let ring = 0; ring < 6; ring += 1) {
        const ringPhase = (phase + ring * 0.8) % (Math.PI * 2);
        const scale = 0.32 + ring * 0.12 + Math.sin(ringPhase) * 0.018;
        ctx.globalAlpha = reveal * (0.06 + carrier * 0.13 + decode * 0.1);
        ctx.strokeStyle = ring % 2 ? '#0096ff' : '#ffd10f';
        ctx.lineWidth = 0.8 + ring * 0.12;
        ctx.setLineDash([8 + ring * 2, 10 - decode * 5]);
        ctx.lineDashOffset = -now * (0.018 + ring * 0.004);
        ctx.beginPath();
        ctx.ellipse(0, 0, rx * scale, ry * scale, Math.sin(ringPhase) * 0.2, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      if (carrier > 0.08) {
        const letters = egg.signature;
        const size = Math.max(12, Math.min(18, rx * 0.135));
        ctx.font = `${size}px ui-monospace, SFMono-Regular, Consolas, monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const letterSpacing = size * 0.64;
        const startX = -((letters.length - 1) * letterSpacing) / 2;
        for (let i = 0; i < letters.length; i += 1) {
          const x = startX + i * letterSpacing;
          const drift = Math.sin(phase * 2.8 + i * 1.37) * (10 * (1 - decode));
          const visible = decode > 0.62 || Math.sin(phase * 3.4 + i * 0.91) > 0.15;
          if (!visible) continue;
          ctx.globalAlpha = reveal * carrier * (0.16 + decode * 0.72);
          ctx.fillStyle = decode > 0.82 ? '#f6f7fb' : (i % 2 ? '#36f7ff' : '#ffd10f');
          ctx.fillText(letters[i], x + drift, ry * 0.48 + Math.cos(phase + i) * (6 * (1 - decode)));
        }
      }

      ctx.restore();

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = reveal * (0.38 + carrier * 0.42 + decode * 0.18);
      ctx.shadowColor = `rgba(54, 247, 255, ${0.35 + egg.flash * 0.2})`;
      ctx.shadowBlur = 14 + carrier * 18 + egg.flash * 24;
      ctx.strokeStyle = egg.decoded ? '#f6f7fb' : '#36f7ff';
      ctx.lineWidth = 1.2 + carrier * 1.4 + decode * 1.2;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;

      if (carrier > 0.32) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = reveal * (0.12 + decode * 0.28 + egg.flash * 0.15);
        ctx.strokeStyle = '#ffd10f';
        ctx.lineWidth = 2.2 + decode * 2;
        for (let i = 0; i < 3; i += 1) {
          const offset = (i - 1) * rx * 0.26;
          ctx.beginPath();
          ctx.moveTo(offset - rx * 0.05, -ry * 0.78);
          ctx.bezierCurveTo(
            offset + Math.sin(phase + i) * rx * 0.18,
            -ry * 0.38,
            offset - Math.cos(phase * 0.8 + i) * rx * 0.2,
            ry * 0.22,
            offset + Math.sin(phase * 1.4 + i) * rx * 0.12,
            ry * 0.78
          );
          ctx.stroke();
        }
      }

      if (egg.decoded) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = reveal * 0.96;
        ctx.font = `${Math.max(13, Math.min(20, rx * 0.15))}px ui-monospace, SFMono-Regular, Consolas, monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(0, 12, 18, 0.88)';
        ctx.fillStyle = '#f6f7fb';
        ctx.strokeText(egg.signature, 0, ry * 0.48);
        ctx.fillText(egg.signature, 0, ry * 0.48);

        ctx.globalAlpha = reveal * (0.32 + egg.flash * 0.28);
        ctx.strokeStyle = '#36f7ff';
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i += 1) {
          ctx.beginPath();
          ctx.moveTo(-rx * 0.78, ry * 0.48 + i * 5 + Math.sin(phase + i) * 2);
          ctx.lineTo(rx * 0.78, ry * 0.48 + i * 5 + Math.cos(phase + i) * 2);
          ctx.stroke();
        }
      } else if (carrier > 0.76) {
        ctx.globalAlpha = reveal * (0.26 + egg.decodeCharge * 0.28);
        ctx.fillStyle = '#36f7ff';
        ctx.font = `${Math.max(10, Math.min(14, rx * 0.105))}px ui-monospace, SFMono-Regular, Consolas, monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('phase unstable', 0, ry * 0.72);
        ctx.strokeStyle = '#ffd10f';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-rx * 0.52, ry * 0.82);
        ctx.lineTo(-rx * 0.52 + rx * 1.04 * egg.decodeCharge, ry * 0.82);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }

    function drawThreads(now) {
      ctx.lineCap = 'round';
      for (const thread of threads) {
        if (thread.broken) {
          const progress = Math.max(0, 1 - thread.heal / 380);
          if (progress < 0.62) continue;
          ctx.globalAlpha = (progress - 0.62) / 0.38;
        } else {
          ctx.globalAlpha = 1;
        }

        const dx = thread.b.x - thread.a.x;
        const dy = thread.b.y - thread.a.y;
        const length = Math.max(1, Math.hypot(dx, dy));
        const nx = -dy / length;
        const ny = dx / length;
        const vibration = Math.sin(now * (0.006 + thread.tension * 0.022) + thread.seed) * thread.tension * 8;
        const midX = (thread.a.x + thread.b.x) / 2 + nx * vibration;
        const midY = (thread.a.y + thread.b.y) / 2 + ny * vibration;
        const color = tensionColor(thread.tension, 0.34 + thread.tension * 0.66);

        ctx.beginPath();
        ctx.moveTo(thread.a.x, thread.a.y);
        ctx.quadraticCurveTo(midX, midY, thread.b.x, thread.b.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 0.8 + thread.tension * 2.1;
        ctx.shadowColor = color;
        ctx.shadowBlur = 5 + thread.tension * 20;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function drawNodes() {
      for (const node of nodes) {
        if (node.pinned) continue;
        ctx.beginPath();
        ctx.arc(node.x, node.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
        ctx.fill();
      }
    }

    function drawSparks(step) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = sparks.length - 1; i >= 0; i -= 1) {
        const spark = sparks[i];
        spark.x += spark.vx * step;
        spark.y += spark.vy * step;
        spark.vx *= 0.96;
        spark.vy *= 0.96;
        spark.life -= 0.035 * step;
        if (spark.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(spark.x, spark.y, 1 + spark.life * 2, 0, Math.PI * 2);
        ctx.fillStyle = spark.color;
        ctx.globalAlpha = spark.life;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    function render(now) {
      const dt = now - lastTime;
      lastTime = now;
      const step = Math.min(2, dt / 16.67);
      updatePhysics(dt, now);
      drawBackground(now);
      drawSignalEgg(now);
      drawThreads(now);
      drawNodes();
      drawSparks(step);
      requestAnimationFrame(render);
    }

    soundToggle.addEventListener('click', toggleSound);
    canvas.addEventListener('pointerdown', grab);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    window.addEventListener('resize', resize);

    resize();
    requestAnimationFrame(render);
  </script>
</body>

</html>

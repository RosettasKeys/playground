<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spring of Ages</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0820;
            font-family: 'Crimson Pro', Georgia, serif;
            min-height: 100vh;
        }

        :root {
            --gold: #c8922a;
            --gold-light: #f0c060;
            --panel-bg: rgba(15, 8, 30, 0.97);
        }

        #app {
            max-width: 1100px;
            margin: 0 auto;
            background: linear-gradient(180deg, #0d0820 0%, #1a1535 40%, #2a1a40 100%);
            border-radius: 12px;
            overflow: hidden;
        }

        #title-bar {
            position: relative;
            text-align: center;
            padding: 18px 20px 10px;
        }

        .rose-back {
            position: absolute;
            top: 22px;
            left: 22px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: rgba(240, 192, 96, 0.72);
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 180ms ease, transform 180ms ease;
        }

        .rose-back:hover,
        .rose-back:focus-visible {
            color: var(--gold-light);
            transform: translateX(-2px);
        }

        .rose-back:focus-visible {
            outline: 1px solid var(--gold-light);
            outline-offset: 5px;
            border-radius: 2px;
        }

        #title-bar h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            color: var(--gold-light);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(200, 146, 42, 0.5);
        }

        #title-bar p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 4px;
            font-style: italic;
        }

        #map-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background-image: url('https://lh3.googleusercontent.com/pw/AP1GczPYiUxmJlLWRFa6YA9xgQBf5sCOqwXWk8ENl0WiS0P592_Uf69ssnc4dZ8ROZZok2ujLR8k3g0-p7ataYf4iYoa827c4zt8MbA4XkhnPlZH6HpFYdAr=w1430-h780-no');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Hide the old SVG paths while using the JPG background */
        .continent,
        .ocean {
            display: none;
        }

        #map-svg {
            background: transparent !important;
        }

        .pin-group {
            cursor: pointer;
        }

        .pin-ring {
            fill: none;
            stroke-width: 1.5;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .pin-dot {
            r: 5;
        }

        @keyframes pulse {

            0%,
            100% {
                r: 10;
                opacity: 0.6;
            }

            50% {
                r: 14;
                opacity: 0.2;
            }
        }

        .pin-label {
            font-family: 'Cinzel', serif;
            font-size: 9px;
            /* Increased from 7px */
            font-weight: bold;
            /* Added bold */
            fill: #ffffff;
            text-anchor: middle;
            pointer-events: none;
            /* This adds a "halo" so the text is readable over the map colors */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8), -1px -1px 2px rgba(0, 0, 0, 0.8);
        }

        #panel {
            position: relative;
            background: var(--panel-bg);
            border-top: 1px solid rgba(200, 146, 42, 0.3);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
        }

        #panel.open {
            max-height: 900px;
        }

        #panel-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 320px;
        }

        #panel-image-side {
            position: relative;
            min-height: 280px;
            background: #0a0818;
            overflow: hidden;
        }

        #panel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #panel-img.loaded {
            opacity: 1;
        }

        #img-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 40px;
        }

        #panel-text-side {
            padding: 20px 22px 16px;
            overflow-y: auto;
            max-height: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #panel-region {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
        }

        #panel-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--gold-light);
            line-height: 1.2;
        }

        .myth-bust {
            background: #fff3c4;
            border-left: 3px solid var(--gold);
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #3a2000;
            font-style: italic;
            line-height: 1.5;
        }

        .myth-bust strong {
            font-style: normal;
            font-weight: 600;
            color: #6a3800;
            display: block;
            margin-bottom: 3px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        #narration-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.7;
            flex: 1;
        }

        .sentence {
            display: inline;
            transition: background 0.2s, color 0.2s;
            border-radius: 2px;
            padding: 0 1px;
        }

        .sentence.active {
            background: rgba(200, 146, 42, 0.35);
            color: #fff;
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: rgba(200, 146, 42, 0.15);
            border: 1px solid rgba(200, 146, 42, 0.4);
            color: var(--gold-light);
            border-radius: 6px;
            padding: 6px 14px;
            font-family: 'Crimson Pro', serif;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(200, 146, 42, 0.3);
        }

        #voice-status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        #progress-bar-wrap {
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 1px;
            overflow: hidden;
            flex: 1;
            min-width: 60px;
        }

        #progress-bar {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.3s;
        }

        #nav-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 16px 14px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-pill {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: 'Crimson Pro', serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-pill:hover,
        .nav-pill.active {
            background: rgba(200, 146, 42, 0.3);
            border-color: var(--gold);
            color: var(--gold-light);
        }

        #close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            cursor: pointer;
            z-index: 5;
        }

        #close-btn:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        #myth-bust-box {
            display: none;
        }

        @media(max-width:600px) {
            .rose-back {
                position: static;
                margin: 0 auto 10px;
            }

            #panel-inner {
                grid-template-columns: 1fr;
            }

            #panel-image-side {
                min-height: 180px;
                max-height: 220px;
            }
        }
    </style>
</head>

        let currentId = null;
        let speaking = false;
        let sentenceEls = [];

        function buildNavPills() {
            const container = document.getElementById('nav-pills');
            Object.keys(TRADITIONS).forEach(id => {
                const item = TRADITIONS[id];
                const pill = document.createElement('button');
                pill.className = 'nav-pill';
                pill.dataset.id = id;
                pill.textContent = item.name;
                pill.style.borderColor = item.color + '55';
                pill.addEventListener('click', () => openPanel(id));
                container.appendChild(pill);
            });
        }

        function openPanel(id) {
            stopSpeaking();
            currentId = id;
            const t = TRADITIONS[id];

            // Update UI State
            document.querySelectorAll('.nav-pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));

            // Sync Map Dots
            document.querySelectorAll('.pin-group').forEach(g => {
                const dot = g.querySelector('.pin-dot');
                const ring = g.querySelector('.pin-ring');
                if (g.dataset.id === id) {
                    dot.setAttribute('r', '7');
                    ring.style.strokeWidth = '2.5';
                } else {
                    dot.setAttribute('r', '5');
                    ring.style.strokeWidth = '1.5';
                }
            });

            // Fill Panel Content
            document.getElementById('panel-region').textContent = t.region;
            document.getElementById('panel-title').textContent = t.name;

            const mb = document.getElementById('myth-bust-box');
            if (t.mythBust) {
                mb.style.display = 'block';
                mb.innerHTML = `<div class="myth-bust"><strong>&#x2605; ${t.mythBust.label}</strong>${t.mythBust.text}</div>`;
            } else {
                mb.style.display = 'none';
            }

            const narEl = document.getElementById('narration-text');
            narEl.innerHTML = '';
            sentenceEls = [];

            t.sentences.forEach((s, i) => {
                const span = document.createElement('span');
                span.className = 'sentence';
                span.dataset.idx = i;
                span.textContent = s + ' ';
                narEl.appendChild(span);
                sentenceEls.push(span);
            });

            // Reset Audio/Progress
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('voice-status').textContent = '';
            document.getElementById('play-btn').textContent = '\u25B6 Read to me';

            // Handle Image
            const imgEl = document.getElementById('panel-img');
            const ph = document.getElementById('img-placeholder');
            imgEl.classList.remove('loaded');

            if (t.image) {
                ph.style.display = 'none';
                imgEl.src = t.image + '?t=' + Date.now();
                imgEl.onload = () => imgEl.classList.add('loaded');
            } else {
                imgEl.src = '';
                ph.style.display = 'flex';
                ph.innerHTML = '<span style="font-size:14px;color:rgba(255,255,255,0.3)">Image coming soon</span>';
            }

            const panel = document.getElementById('panel');
            panel.classList.add('open');
            setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        function getVoice() {
            const voices = speechSynthesis.getVoices();
            // These are the "Premium" sounding voices in Chrome and Windows
            const preferred = [
                'Google US English',
                'Microsoft Natural',
                'Microsoft Aria Online',
                'Microsoft Guy Online',
                'Microsoft David Desktop'
            ];

            for (const name of preferred) {
                const v = voices.find(v => v.name.includes(name));
                if (v) return v;
            }
            return voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        function stopSpeaking() {
            speechSynthesis.cancel();
            speaking = false;
            sentenceEls.forEach(el => el.classList.remove('active'));
            document.getElementById('play-btn').textContent = '\u25B6 Read to me';
            document.getElementById('voice-status').textContent = '';
        }

        function startSpeaking() {
            if (!currentId) return;
            const t = TRADITIONS[currentId];
            speaking = true;
            document.getElementById('play-btn').textContent = '\u23F8 Stop';
            document.getElementById('voice-status').textContent = 'Speaking...';

            function speakNext(idx) {
                if (idx >= t.sentences.length || !speaking) {
                    stopSpeaking();
                    document.getElementById('voice-status').textContent = 'Done!';
                    document.getElementById('progress-bar').style.width = '100%';
                    return;
                }

                // Highlight sentence
                sentenceEls.forEach((el, i) => el.classList.toggle('active', i === idx));
                document.getElementById('progress-bar').style.width = Math.round(((idx + 1) / t.sentences.length) * 100) + '%';

                const utt = new SpeechSynthesisUtterance(t.sentences[idx]);
                const voice = getVoice();
                if (voice) utt.voice = voice;
                utt.rate = 0.85;  // Slightly slower than normal (1.0) for clarity
                utt.pitch = 1.1; // A tiny bit higher to sound more friendly/energetic
                utt.onend = () => { if (speaking) speakNext(idx + 1); };
                speechSynthesis.speak(utt);
            }

            speechSynthesis.cancel();
            setTimeout(() => speakNext(0), 100);
        }

        // Event Listeners
        document.getElementById('play-btn').addEventListener('click', () => {
            if (speaking) stopSpeaking(); else startSpeaking();
        });

        document.getElementById('close-btn').addEventListener('click', () => {
            stopSpeaking();
            document.getElementById('panel').classList.remove('open');
            currentId = null;
            document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
        });

        document.querySelectorAll('.pin-group').forEach(g => {
            g.addEventListener('click', () => openPanel(g.dataset.id));
        });

        // Initialize
        buildNavPills();
        window.addEventListener('beforeunload', () => speechSynthesis.cancel());
    </script>
